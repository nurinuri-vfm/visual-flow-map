<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>処理フロー全図</title>
<style>
  /* 色は「役割」で持ち、テーマごとに値だけ差し替える。
     意味色（正常系/条件分岐/失敗）は透明度を変えて多用するので、rgb 3値も併せて持つ。
     こうしておくと rgba(var(--main-rgb), .2) の形で全バリエーションがテーマに追従する */
  :root{
    color-scheme: dark;
    --bg:#070b18; --bg2:#0c1226; --panel:#111a33; --panel2:#0e1730;
    --glow1:#16224a; --glow2:#0f2f47;                    /* body の放射グラデ */
    --head-bg:linear-gradient(180deg,rgba(11,17,38,.92),rgba(11,17,38,.55));
    --deck-bg:rgba(7,11,24,.55);
    --surface:linear-gradient(180deg,rgba(14,23,48,.96),rgba(9,14,32,.96));  /* 右パネル */
    --legend-bg:#070b18;
    --elev1:linear-gradient(180deg,#111c38,#0d1730);     /* ノード */
    --elev1-solid:#0d1730;                                /* ノードの混合ベース */
    --elev3:rgba(8,13,30,.97);                            /* ツールチップ・ヒント */
    --badge-bg:rgba(7,11,24,.9);
    --shadow-strong:#000;
    --line:#1f2c4d; --line2:#2b3c66;
    --hair:rgba(120,150,220,.14);                         /* レーン境界 */
    --grid:rgba(120,150,220,.10);                         /* 点グリッド */
    --wash:rgba(255,255,255,.012);                        /* レーン帯 */
    --scroll:#1d2b4e;
    --chip:rgba(255,255,255,.04);
    --fg:#e8eeff; --fg2:#9fb0d6; --fg3:#8493b3;  /* fg3 は旧 #65779f だと本文背景に対し 4.39:1 で AA 未達 */
    --fg-strong:#fff;                                     /* 強調文字 */
    --on-fill:#052b28;                                    /* 塗りチップの上に載る文字 */
    --elabel-fg:#cfe4ff;                                  /* 経路ラベル */
    --accent:#5b8cff; --accent2:#38e1d6;
    --main:#38e1d6; --alt:#ffb648; --err:#ff6b7d; --new:#34d399;
    --main-rgb:56,225,214; --alt-rgb:255,182,72; --err-rgb:255,107,125;
    --accent-rgb:91,140,255; --new-rgb:52,211,153;
    --glow-blur:5px;                                      /* 経路の発光量 */
    --ui:#a78bfa; --app:#5b8cff; --api:#38bdf8; --svc:#22d3ee; --job:#a3e635;
    --db:#f59e0b; --store:#fb923c; --mqtt:#f472b6; --device:#34d399; --hw:#94a3b8; --ext:#e879f9;
    --rt:#c084fc; --net:#60a5fa;
  }

  /* ライト。暗地の「発光」は白地では成立しないので、光を影に置き換え、
     経路は「最も濃いインク」として立たせる。意味色は暗地用より濃くする（AA 確保） */
  :root[data-theme="light"]{
    color-scheme: light;
    --bg:#eef2f8; --bg2:#e6ecf5; --panel:#fff; --panel2:#f7f9fd;
    --glow1:#dfe8f8; --glow2:#dff0f4;
    --head-bg:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
    --deck-bg:rgba(255,255,255,.72);
    --surface:linear-gradient(180deg,#fff,#fbfcfe);
    --legend-bg:#fff;
    --elev1:linear-gradient(180deg,#fff,#f6f9fd);
    --elev1-solid:#fff;
    --elev3:rgba(255,255,255,.98);
    --badge-bg:rgba(255,255,255,.92);
    --shadow-strong:rgba(23,42,77,.34);
    --line:#dde5f0; --line2:#c4d0e2;
    --hair:rgba(70,95,140,.18);
    --grid:rgba(70,95,140,.16);
    --wash:rgba(13,21,38,.016);
    --scroll:#c4d0e2;
    --chip:rgba(13,21,38,.045);
    --fg:#0d1526; --fg2:#47566f; --fg3:#5b6a80;
    --fg-strong:#0d1526;
    --on-fill:#fff;
    --elabel-fg:#1c3d63;
    --accent:#2563d9; --accent2:#00736d;
    --main:#00736d; --alt:#875800; --err:#b21f40; --new:#0a7c53;
    --main-rgb:0,115,109; --alt-rgb:135,88,0; --err-rgb:178,31,64;
    --accent-rgb:37,99,217; --new-rgb:10,124,83;
    --glow-blur:0px;
    --ui:#6a4bb4; --app:#2e59c7; --api:#006c94; --svc:#007080; --job:#4b7100;
    --db:#8a5600; --store:#964d00; --mqtt:#a62871; --device:#007651; --hw:#576478; --ext:#9625a6;
    --rt:#7b3fc4; --net:#2f5fc0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 12% -10%, var(--glow1) 0%, transparent 60%),
      radial-gradient(900px 500px at 92% 0%, var(--glow2) 0%, transparent 55%),
      var(--bg);
    color:var(--fg);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px; line-height:1.6; overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100vh}

  /* ---------- header ---------- */
  header{
    padding:12px 18px 10px; border-bottom:1px solid var(--line);
    background:var(--head-bg);
    backdrop-filter:blur(8px); flex:0 0 auto;
  }
  .titlerow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:19px;letter-spacing:.06em;font-weight:800}
  h1 .mark{
    background:linear-gradient(92deg,var(--accent2),var(--accent) 60%,var(--ui));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--fg3);font-size:12px}
  .stat{color:var(--fg2);font-size:12px;margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
  .stat b{color:var(--fg);font-variant-numeric:tabular-nums}

  /* ---------- controls ---------- */
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .ctl{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--panel);border:1px solid var(--line2);color:var(--fg2);
    border-radius:9px;padding:5px 10px;font-size:12px;cursor:pointer;
    transition:.15s; white-space:nowrap; font-family:inherit;
  }
  .ctl:hover{border-color:var(--accent);color:var(--fg)}
  .ctl.on{background:rgba(var(--accent-rgb),.18);border-color:var(--accent);color:var(--fg-strong)}
  .ctl[disabled]{opacity:.4;cursor:default}
  input.search{
    background:var(--panel);border:1px solid var(--line2);color:var(--fg);
    border-radius:9px;padding:6px 11px;font-size:12px;min-width:210px;font-family:inherit;outline:none;
  }
  input.search:focus{border-color:var(--accent)}
  .sep{width:1px;height:20px;background:var(--line2);margin:0 3px}

  /* ---------- buttons deck ---------- */
  .deck{
    flex:0 0 auto;max-height:26vh;overflow:auto;padding:10px 18px 12px;
    border-bottom:1px solid var(--line);background:var(--deck-bg);
    transition:max-height .25s, padding .25s;
  }
  .deck.folded{max-height:0;padding-top:0;padding-bottom:0;overflow:hidden;border-bottom-color:transparent}
  .catgrid{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .cat{min-width:190px;flex:1 1 210px}
  .cat h2{
    margin:0 0 6px;font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--fg3);
    display:flex;align-items:center;gap:6px;
  }
  .cat h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .btns{display:flex;flex-direction:column;gap:5px}
  button.flowbtn{
    position:relative;text-align:left;font-family:inherit;font-size:12.5px;line-height:1.35;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line2);border-radius:10px;color:var(--fg2);
    padding:7px 10px 7px 24px;cursor:pointer;transition:.16s;
  }
  button.flowbtn::before{
    content:"";position:absolute;left:9px;top:50%;transform:translateY(-50%);
    width:7px;height:7px;border-radius:50%;background:var(--line2);transition:.16s;
  }
  button.flowbtn:hover{border-color:var(--accent);color:var(--fg);transform:translateX(2px)}
  button.flowbtn:hover::before{background:var(--accent)}
  button.flowbtn.sel{
    color:var(--fg-strong);border-color:var(--accent2);
    background:linear-gradient(180deg,rgba(var(--main-rgb),.20),rgba(var(--main-rgb),.06));
    box-shadow:0 0 0 1px rgba(var(--main-rgb),.25),0 6px 22px -8px rgba(var(--main-rgb),.55);
  }
  button.flowbtn.sel::before{background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
  button.flowbtn .trg{display:block;color:var(--fg3);font-size:10.5px;margin-top:1px}
  button.flowbtn.sel .trg{color:var(--fg2)}
  button.flowbtn.hidden{display:none}

  /* ---------- stage ---------- */
  .stage{flex:1 1 auto;display:flex;min-height:0}
  .canvaswrap{
    flex:1 1 auto;position:relative;overflow:auto;
    background-image:radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
    background-size:26px 26px;
  }
  /* canvas はスクロール範囲そのもの（実寸=倍率適用後）。拡縮は内側の zoomlayer に掛ける */
  .canvas{position:relative;overflow:hidden}
  .zoomlayer{position:absolute;left:0;top:0;transform-origin:0 0}
  svg.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}
  svg.edges path{fill:none;stroke:var(--line2);stroke-width:1.4;opacity:.5;transition:opacity .25s,stroke .25s,stroke-width .25s}
  svg.edges path.hot{stroke:var(--main);stroke-width:2.4;opacity:1;filter:drop-shadow(0 0 var(--glow-blur) rgba(var(--main-rgb),.65))}
  svg.edges path.hot.alt{stroke:var(--alt);filter:drop-shadow(0 0 var(--glow-blur) rgba(var(--alt-rgb),.6))}
  svg.edges path.hot.err{stroke:var(--err);stroke-dasharray:7 5;filter:drop-shadow(0 0 var(--glow-blur) rgba(var(--err-rgb),.6))}
  svg.edges path.pending{opacity:.13}
  /* 経路の根拠。色は分岐（正常/条件/失敗）が担うので、根拠は線の切り方と印で示す */
  svg.edges path.ev-framework{stroke-dasharray:2 4}
  svg.edges path.ev-unverified{stroke-dasharray:1 5;opacity:.5}
  svg.edges path.hot.ev-unverified{opacity:.85}
  svg.edges .evmark{font-size:11px;font-weight:800;fill:var(--fg3);paint-order:stroke;stroke:var(--bg);stroke-width:3px;
    pointer-events:none;font-family:inherit}
  svg.edges .evmark.q{fill:var(--alt)}
  svg.edges path.faded{opacity:.06}
  svg.edges path.dash{stroke-dasharray:9 7;animation:march 1s linear infinite}
  @keyframes march{to{stroke-dashoffset:-16}}
  svg.edges .elabel{
    font-size:9.5px;fill:var(--fg3);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;
    opacity:0;transition:opacity .25s;font-family:inherit;
  }
  svg.edges .elabel.show{opacity:.95;fill:var(--elabel-fg)}

  .lane{position:absolute;left:0;border-top:1px dashed var(--hair)}
  .lane .lanebg{position:absolute;inset:0;background:var(--wash)}
  #lanebar{position:absolute;left:0;top:0;z-index:8;pointer-events:none;will-change:transform}
  #lanebar .lt{
    position:absolute;left:6px;white-space:nowrap;
    font-size:9.5px;letter-spacing:.14em;font-weight:700;
    background:var(--badge-bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;
  }

  .node{
    position:absolute;border-radius:11px;padding:6px 9px;cursor:default;
    background:var(--elev1);
    border:1px solid var(--line2);
    transition:opacity .3s, transform .3s, box-shadow .3s, border-color .3s, background .3s;
    overflow:hidden;
  }
  .node .nlabel{font-size:11.5px;font-weight:700;color:var(--fg);line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .node .nmeta{font-size:9px;color:var(--fg3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .node .idx{
    position:absolute;right:-1px;top:-1px;min-width:19px;height:17px;padding:0 4px;
    border-radius:0 10px 0 9px;background:var(--main);color:var(--on-fill);
    font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;
  }
  .node.on .idx{display:flex}
  .node.on.altOnly .idx{background:var(--alt);color:var(--on-fill)}
  .node.on.errOnly .idx{background:var(--err);color:var(--on-fill)}
  .node:hover{border-color:var(--c);z-index:5;box-shadow:0 8px 26px -10px var(--shadow-strong)}
  .node.dim{opacity:.16}
  .node.on{
    opacity:1;border-color:var(--c);
    background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,var(--elev1-solid)),var(--elev1-solid));
    box-shadow:0 0 0 1px var(--c),0 0 22px -6px var(--c);
  }
  .node.pending{opacity:.28}
  /* 白リングはレーン色の意味を壊し、1.06 の拡大は2行クランプの日本語ラベルをにじませる */
  .node.cur{transform:scale(1.035);z-index:6;box-shadow:0 0 0 2px var(--c),0 0 34px -4px var(--c);
    animation:pop .42s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.07)}100%{transform:scale(1.035)}}
  .node.hit{outline:2px solid var(--accent2);outline-offset:2px}
  .node .chg{position:absolute;left:-1px;top:-1px;padding:0 5px;height:15px;display:flex;align-items:center;
    border-radius:10px 0 8px 0;font-size:8.5px;font-weight:800;background:var(--new);color:var(--on-fill);z-index:2}
  .node .chg.mod{background:var(--alt);color:var(--on-fill)}
  button.flowbtn .fchip{display:inline-block;margin-left:6px;padding:0 5px;border-radius:6px;font-size:9px;font-weight:800;
    background:rgba(var(--new-rgb),.18);color:var(--new);border:1px solid rgba(var(--new-rgb),.4)}
  button.flowbtn .fchip.mod{background:rgba(var(--alt-rgb),.14);color:var(--alt);border-color:rgba(var(--alt-rgb),.4)}

  /* ---------- side panel ---------- */
  aside{
    flex:0 0 clamp(280px,25vw,380px);border-left:1px solid var(--line);
    background:var(--surface);
    display:flex;flex-direction:column;min-height:0;
  }
  /* #apanel が flex 縦積みでないと .steps の overflow:auto が効かず、手順が下まで読めなくなる */
  #apanel{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  aside .ahead{padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
  aside .ahead .t{font-size:14.5px;font-weight:800;line-height:1.35}
  aside .ahead .g{font-size:11px;color:var(--fg3);margin-top:3px}
  aside .ahead .trigger{
    margin-top:8px;font-size:11.5px;color:var(--accent2);
    background:rgba(var(--main-rgb),.09);border:1px solid rgba(var(--main-rgb),.25);
    border-radius:8px;padding:5px 8px;
  }
  .steps{flex:1 1 auto;overflow:auto;padding:8px 10px 16px}
  .step{
    display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 7px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;transition:.15s;
  }
  .step:hover{background:rgba(var(--accent-rgb),.10);border-color:var(--line2)}
  .step.cur{background:rgba(var(--main-rgb),.13);border-color:rgba(var(--main-rgb),.4)}
  .step.future{opacity:.35}
  .step .no{
    width:22px;height:22px;border-radius:7px;background:var(--panel);border:1px solid var(--line2);
    font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--fg2);
    font-variant-numeric:tabular-nums;
  }
  .step.b-alt .no{border-color:var(--alt);color:var(--alt)}
  .step.b-error .no{border-color:var(--err);color:var(--err)}
  .step.cur .no{background:var(--main);color:var(--on-fill);border-color:var(--main)}
  /* 現在ステップでも分岐の色を保つ（.step.cur .no が後勝ちすると alt/error が正常系の色になる） */
  .step.cur.b-alt .no{background:var(--alt);color:var(--on-fill);border-color:var(--alt)}
  .step.cur.b-error .no{background:var(--err);color:var(--on-fill);border-color:var(--err)}
  .step .body{min-width:0}
  .step .arrow{font-size:11.5px;color:var(--fg);line-height:1.4}
  .step .arrow .to{color:var(--fg-strong);font-weight:700}
  .step .arrow .ar{color:var(--fg3);margin:0 4px}
  .step .desc{font-size:10.5px;color:var(--fg2);margin-top:1px}
  .step .evtag{display:inline-block;margin-top:3px;font-size:9.5px;padding:1px 6px;border-radius:6px;
    border:1px dashed var(--line2);color:var(--fg3);cursor:help}
  .step .evtag.unverified{border-color:rgba(var(--alt-rgb),.5);color:var(--alt);border-style:solid}
  .step .ref{font-size:9.5px;color:var(--fg3);margin-top:2px;font-family:ui-monospace,Menlo,Consolas,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .notes{margin:6px 10px 14px;padding:9px 11px;border-radius:10px;background:rgba(var(--alt-rgb),.07);
    border:1px solid rgba(var(--alt-rgb),.22)}
  .notes h3{margin:0 0 5px;font-size:10px;letter-spacing:.14em;color:var(--alt)}
  .notes li{font-size:11px;color:var(--fg2);margin:0 0 4px}
  .notes ul{margin:0;padding-left:16px}
  .empty{padding:26px 16px;color:var(--fg3);font-size:12px;text-align:center;line-height:1.9}
  .empty .k{color:var(--fg2);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;font-size:11px}

  /* ---------- legend / tooltip ---------- */
  .legend{display:flex;gap:9px;flex-wrap:wrap;padding:7px 14px;border-top:1px solid var(--line);
    background:var(--legend-bg);font-size:10px;color:var(--fg3);flex:0 0 auto;align-items:center}
  .lg{display:inline-flex;align-items:center;gap:4px}
  .dot{width:8px;height:8px;border-radius:3px;background:var(--c)}
  #tip{
    position:fixed;z-index:99;max-width:340px;pointer-events:none;opacity:0;transition:opacity .12s;
    background:var(--elev3);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;
    box-shadow:0 18px 40px -14px var(--shadow-strong);
  }
  #tip .tt{font-size:12px;font-weight:800;color:var(--fg-strong)}
  #tip .td{font-size:11px;color:var(--fg2);margin-top:3px}
  #tip .tr{font-size:10px;color:var(--fg3);margin-top:4px;font-family:ui-monospace,Menlo,Consolas,monospace}
  #tip .tk{font-size:9.5px;letter-spacing:.1em;color:var(--c);margin-bottom:2px;font-weight:700}
  #hint{
    position:fixed;z-index:60;max-width:360px;line-height:1.7;
    background:var(--elev3);border:1px solid var(--accent2);border-radius:12px;
    padding:10px 34px 10px 14px;font-size:12.5px;color:var(--fg);
    box-shadow:0 18px 40px -14px var(--shadow-strong);
  }
  #hint b{color:var(--accent2)}
  #hint .x{position:absolute;right:6px;top:5px;cursor:pointer;color:var(--fg3);font-size:14px;padding:2px 7px}
  #hint .x:hover{color:var(--fg-strong)}
  .legend a{text-decoration:none}
  .legend a:hover{color:var(--fg2)}

  /* 紙に暗地は刷れないので、印刷時はライトの値を使う */
  @media print{
    :root{
      --bg:#fff; --bg2:#fff; --panel:#fff; --panel2:#fff; --glow1:#fff; --glow2:#fff;
      --head-bg:#fff; --deck-bg:#fff; --surface:#fff; --legend-bg:#fff;
      --elev1:#fff; --elev1-solid:#fff; --elev3:#fff; --badge-bg:#fff;
      --line:#c9d3e2; --line2:#aebbcd; --hair:rgba(70,95,140,.3); --grid:transparent; --wash:transparent;
      --fg:#0d1526; --fg2:#3d4b63; --fg3:#54637a; --fg-strong:#000; --on-fill:#fff; --elabel-fg:#1c3d63;
      --main:#00736d; --alt:#875800; --err:#b21f40; --new:#0a7c53;
      --main-rgb:0,115,109; --alt-rgb:135,88,0; --err-rgb:178,31,64; --new-rgb:10,124,83;
      --accent:#2563d9; --accent-rgb:37,99,217; --shadow-strong:rgba(0,0,0,.25); --glow-blur:0px;
    }
    body{background:#fff}
    .controls,.panes,#hint,.themebtn{display:none !important}
    .deck{max-height:none}
  }

  /* OS の「視差効果を減らす」設定では演出を止める（機能は全て残す） */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;scroll-behavior:auto !important}
    svg.edges path.dash{animation:none}
    .node.cur{transform:none}
  }

     縦積みのままだと図の領域が 375×157px しか残らず、倍率が下限に張り付いて

    .controls::-webkit-scrollbar{display:none}
    .controls>*{flex:0 0 auto}
    #btnFold{display:none}                     /* デッキはペインになるので不要 */
    .stage{flex-direction:column;flex:1 1 auto;min-height:0}
    .deck{max-height:none;flex:1 1 auto;min-height:0;border-bottom:none}
    .deck.folded{max-height:none;padding:10px 18px 12px}
    .canvaswrap,aside{min-height:0}

    #app[data-pane="map"]   .canvaswrap{display:block;flex:1 1 auto}
    #app[data-pane="steps"] aside      {display:flex;flex:1 1 auto;border-left:none;border-top:none}
    .panes{display:grid;grid-template-columns:repeat(3,1fr);

    .legend{max-height:22vh;overflow:auto}
    aside{flex:1 1 auto}

  @media (pointer:coarse){

    .legend a{display:inline-block;padding:7px 4px}
  }

<div id="app">
  <header>
    <div class="titlerow">
      <h1><span class="mark">処理フロー全図</span></h1>

      <span class="stat" id="stat"></span>

  </header>

  <div class="stage">
    <div class="canvaswrap" id="wrap">
      <div class="canvas" id="canvas">
        <div class="zoomlayer" id="zoomlayer">
          <svg class="edges" id="edges"></svg>
        </div>
      </div>
      <div id="lanebar"></div>
    </div>
    <aside>
      <div id="apanel"></div>
    </aside>
  </div>

  <nav class="panes" id="panes" role="group" aria-label="表示の切り替え">
    <button class="pane" data-pane="deck"  aria-pressed="false"></button>
    <button class="pane" data-pane="map"   aria-pressed="true"></button>
    <button class="pane" data-pane="steps" aria-pressed="false"></button>
  </nav>
  <div class="legend" id="legend"></div>
</div>

istory","label":"fingerprintが変わっていれば証明書の送信履歴を削除","branch":"tls","kind":"query","evidence":"direct"},{"from":"svc.monitor.handleTlsInfo","to":"svc.utilServer.checkCertExpiryNotifications","label":"期限通知が有効なら期限をチェック","branch":"tls","kind":"call","evidence":"direct"},{"from":"svc.utilServer.checkCertExpiryNotifications","to":"db.notification","label":"通知先一覧を取得(notification×monitor_notification)","branch":"tls","kind":"query","evidence":"direct"},{"from":"svc.utilServer.checkCertExpiryNotifications","to":"svc.monitor.sendCertNotificationByTargetDays","label":"設定日数(既定7/14/21日)以下なら通知","branch":"tls","kind":"call","evidence":"direct"},{"from":"svc.monitor.sendCertNotificationByTargetDays","to":"db.notification_sent_history","label":"type=certificateで送信済みかを確認","branch":"tls","kind":"query","evidence":"direct"},{"from":"svc.monitor.sendCertNotificationByTargetDays","to":"svc.notification.send","label":"証明書期限を通知","branch":"tls","kind":"call","evidence":"direct"},{"from":"svc.notification.send","to":"ext.notification_provider","label":"外部通知サービスへ送信","branch":"normal","kind":"call","evidence":"direct"},{"from":"job.monitor.beat","to":"svc.domainExpiry.checkSupport","label":"ドメイン期限監視の対象かを確認","branch":"domain","kind":"call","evidence":"direct"},{"from":"svc.domainExpiry.checkSupport","to":"ext.iana_rdap_directory","label":"対象TLDのRDAP対応可否をIANAディレクトリで確認","branch":"domain","kind":"call","evidence":"direct"},{"from":"job.monitor.beat","to":"svc.domainExpiry.checkExpiry","label":"ドメインの期限日を取得","branch":"domain","kind":"call","evidence":"direct"},{"from":"svc.domainExpiry.checkExpiry","to":"ext.rdap_server","label":"ドメインの有効期限をRDAPへ問い合わせ","branch":"domain","kind":"call","evidence":"direct"},{"from":"svc.domainExpiry.checkExpiry","to":"db.domain_expiry","label":"expiry/lastCheckを更新","branch":"domain","kind":"query","evidence":"direct"},{"from":"job.monitor.beat","to":"svc.monitor.getNotificationList","label":"通知先一覧を取得","branch":"domain","kind":"call","evidence":"direct"},{"from":"job.monito const FLOW_WORD = META.flowWord || STR.flowWord;
/* 同じ「順番に光る」演出が、モードによって別の順序を指す。図の側で宣言しないと受け手が誤読する */

  ? { code:'lights up in execution order', event:'lights up in the order things happened',
      concept:'lights up in the order of understanding — not execution order' }[MODE]
  : { code:'実行される順に光ります', event:'起きた順に光ります',
      concept:'理解の順に光ります（実行順ではありません）' }[MODE];
/* --diff-base 付きでビルドされた場合の差分情報（ノード/フローに NEW・変更 バッジを付ける） */
const DIFF = META.diff || null;
const DIFF_NEW = new Set(DIFF ? DIFF.addedNodes : []);
const DIFF_MOD = new Set(DIFF ? DIFF.changedNodes : []);
const DIFF_FLOW_NEW = new Set(DIFF ? DIFF.addedFlows : []);
const DIFF_FLOW_MOD = new Set(DIFF ? DIFF.changedFlows : []);
const NW = 176, NH = 52, COLW = 236, ROWH = 70, LANE_PAD = 26, XPAD = 74, YPAD = 16;

/* ============================ 前処理 ============================ */
/* OS の「視差効果を減らす」設定を尊重する（スクロール・演出の可否を1箇所で判定） */
const REDUCE_MOTION = matchMedia('(prefers-reduced-motion: reduce)');
const motionOK = () => !REDUCE_MOTION.matches;
const HOVER = matchMedia('(hover: hover)').matches;   // タッチ端末ではツールチップを出さない
const MOBILE = () => matchMedia('(max-width:700px)').matches;

const NODES = new Map();
for (const n of DATA.nodes) {
  if (!n || !n.id) continue;
  const prev = NODES.get(n.id);
  if (prev) {
    if ((n.detail||'').length > (prev.detail||'').length) prev.detail = n.detail;
    if (!prev.ref && n.ref) prev.ref = n.ref;
    continue;
  }
  NODES.set(n.id, {id:n.id, lane:LANE_LABEL[n.lane]?n.lane:FALLBACK_LANE, label:n.label||n.id, detail:n.detail||'', ref:n.ref||''});
}
const EV_RANK = { direct:0, inferred:1, framework:2, unverified:3 };  // 大きいほど根拠が弱い
const EDGES = new Map(); // key -> {from,to,label,kind,evidence}
const ekey = (f,t)=>f+''+t;
function addEdge(e){
  if(!e||!e.from||!e.to||e.from===e.to) return;
  if(!NODES.has(e.from)||!NODES.has(e.to)) return;
  const k = ekey(e.from,e.to);
  const cur = EDGES.get(k);
  if(cur){ if(!cur.label && e.label) cur.label=e.label; if(!cur.kind && e.kind) cur.kind=e.kind;
           // 同じ経路に複数の申告があれば弱いほうを残す（実態より強く見せない）
           if(EV_RANK[e.evidence]!==undefined &&
              (cur.evidence===undefined||cur.evidence===''||EV_RANK[e.evidence]>EV_RANK[cur.evidence])) cur.evidence=e.evidence;
           return; }
  EDGES.set(k,{from:e.from,to:e.to,label:e.label||'',kind:e.kind||'call',evidence:e.evidence||''});
}
DATA.edges.forEach(addEdge);
const FLOWS = DATA.flows.filter(f=>f&&f.steps&&f.steps.length).map(f=>({
  ...f, steps: f.steps.filter(s=>s&&NODES.has(s.from)&&NODES.has(s.to))
})).filter(f=>f.steps.length);
FLOWS.forEach(f=>f.steps.forEach(s=>addEdge(s)));

const EDGELIST = [...EDGES.values()];
const CAT_ORDER = Array.isArray(META.catOrder) ? META.catOrder : [];

/* ============================ レイアウト ============================ */
function layout(nodeIds, edges){
  const ids = [...nodeIds];
  const inSet = new Set(ids);
  const es = edges.filter(e=>inSet.has(e.from)&&inSet.has(e.to));
  const out = new Map(ids.map(i=>[i,[]]));
  const indeg = new Map(ids.map(i=>[i,0]));
  es.forEach(e=>{ out.get(e.from).push(e.to); indeg.set(e.to, indeg.get(e.to)+1); });

  // 逆流エッジ（サイクル）を DFS で検出して層計算から除外
  const back = new Set(), state = new Map(ids.map(i=>[i,0]));
  const roots = ids.filter(i=>indeg.get(i)===0);
  const order = roots.length ? [...roots, ...ids] : ids;
  for (const r of order){
    if (state.get(r) !== 0) continue;
    const stack = [[r, 0]];
    state.set(r, 1);
    while (stack.length){
      const top = stack[stack.length-1];
      const kids = out.get(top[0]);
      if (top[1] >= kids.length){ state.set(top[0], 2); stack.pop(); continue; }
      const nx = kids[top[1]++];
      const st = state.get(nx);
      if (st === 1) back.add(ekey(top[0], nx));
      else if (st === 0){ state.set(nx, 1); stack.push([nx, 0]); }
    }
  }
  const fwd = es.filter(e=>!back.has(ekey(e.from,e.to)));

  // 最長経路で深さを決める
  const fout = new Map(ids.map(i=>[i,[]])), find = new Map(ids.map(i=>[i,0]));
  fwd.forEach(e=>{ fout.get(e.from).push(e.to); find.set(e.to, find.get(e.to)+1); });
  const depth = new Map(ids.map(i=>[i,0]));
  const q = ids.filter(i=>find.get(i)===0);
  const seen = new Set(q);
  while(q.length){
    const v = q.shift();
    for(const w of fout.get(v)){
      if(depth.get(w) < depth.get(v)+1) depth.set(w, depth.get(v)+1);
      find.set(w, find.get(w)-1);
      if(find.get(w)===0 && !seen.has(w)){ seen.add(w); q.push(w); }
    }
  }
  // 未処理（残サイクル）を救済
  ids.forEach(i=>{ if(!seen.has(i)){ let d=0; es.forEach(e=>{ if(e.to===i) d=Math.max(d, depth.get(e.from)+1);}); depth.set(i,d);} });

  // レーンごとに（深さ→行）を割り当て
  const pos = new Map();
  const laneOrder = LANES.map(l=>l[0]).filter(l=>ids.some(i=>NODES.get(i).lane===l));
  let y = YPAD;
  const laneBoxes = [];
  let maxDepth = 0; ids.forEach(i=>maxDepth=Math.max(maxDepth,depth.get(i)));
  for(const lane of laneOrder){
    const mine = ids.filter(i=>NODES.get(i).lane===lane)
                    .sort((a,b)=> depth.get(a)-depth.get(b) || a.localeCompare(b));
    const perDepth = new Map();
    let rows = 1;
    for(const id of mine){
      const d = depth.get(id);
      const r = perDepth.get(d) || 0;
      perDepth.set(d, r+1);
      rows = Math.max(rows, r+1);
      pos.set(id, {x: XPAD + d*COLW, row:r, lane});
    }
    const h = rows*ROWH + LANE_PAD;
    laneBoxes.push({lane, top:y, height:h});
    for(const id of mine){ const p=pos.get(id); p.y = y + LANE_PAD*0.72 + p.row*ROWH; }
    y += h;
  }
  return {pos, depth, laneBoxes, width: XPAD*2 + (maxDepth+1)*COLW, height: y + 24};
}

/* 全体マップ用：レーンごとに格子詰めしたコンパクト配置（経路ではなく分布を見るための版） */
function layoutGrid(nodeIds){
  const ids = [...nodeIds];
  const pos = new Map(), laneBoxes = [];
  const laneOrder = LANES.map(l=>l[0]).filter(l=>ids.some(i=>NODES.get(i).lane===l));
  let y = YPAD, width = 0;
  const GW = NW + 16, GH = 60;
  for(const lane of laneOrder){
    const mine = ids.filter(i=>NODES.get(i).lane===lane).sort((a,b)=>a.localeCompare(b));
    const cols = Math.max(1, Math.min(22, Math.ceil(Math.sqrt(mine.length*2.6))));
    mine.forEach((id,k)=>{
      const c = k%cols, r = (k-c)/cols;
      pos.set(id, {x: XPAD + c*GW, y: y + LANE_PAD*0.72 + r*GH, row:r});
    });
    const rows = Math.ceil(mine.length/cols) || 1;
    const h = rows*GH + LANE_PAD;
    laneBoxes.push({lane, top:y, height:h});
    y += h;
    width = Math.max(width, XPAD*2 + cols*GW);
  }
  return {pos, laneBoxes, width, height: y+24, grid:true};
}

/* ============================ 描画 ============================ */
const canvas = document.getElementById('canvas');
const layer = document.getElementById('zoomlayer');
const svg = document.getElementById('edges');
const wrap = document.getElementById('wrap');
const tip = document.getElementById('tip');
const SVGNS = 'http://www.w3.org/2000/svg';
let view = {nodeEls:new Map(), edgeEls:new Map(), labelEls:new Map(), lay:null, ids:null, edges:null};
let zoom = 1;

function render(ids, edges, grid){
  const lay = grid ? layoutGrid(ids) : layout(ids, edges);
  view = {nodeEls:new Map(), edgeEls:new Map(), labelEls:new Map(), lay, ids:new Set(ids), edges};
  layer.querySelectorAll('.node,.lane').forEach(e=>e.remove());
  svg.innerHTML = '';
  canvas.style.width = (lay.width*zoom)+'px';
  canvas.style.height = (lay.height*zoom)+'px';
  layer.style.width = lay.width+'px';
  layer.style.height = lay.height+'px';
  svg.setAttribute('viewBox', `0 0 ${lay.width} ${lay.height}`);
  svg.setAttribute('width', lay.width); svg.setAttribute('height', lay.height);

  for(const lb of lay.laneBoxes){
    const d = document.createElement('div');
    d.className = 'lane';
    d.style.cssText = `top:${lb.top}px;height:${lb.height}px;width:${lay.width}px`;
    d.innerHTML = `<div class="lanebg"></div>`;
    layer.appendChild(d);
  }
  drawLaneBar();
  for(const e of edges){
    if(!lay.pos.has(e.from)||!lay.pos.has(e.to)) continue;
    const p = document.createElementNS(SVGNS,'path');
    p.setAttribute('d', edgePath(lay.pos.get(e.from), lay.pos.get(e.to)));
    if(e.evidence && e.evidence!=='direct'){
      p.dataset.ev = e.evidence;
      p.setAttribute('class','ev-'+e.evidence);
    }
    svg.appendChild(p);
    view.edgeEls.set(ekey(e.from,e.to), p);
    // 根拠が「暗黙(framework)」「未確認(unverified)」の経路には印を置く。
    // 線種だけだと縮小時に見分けが付かず、色は分岐(正常/条件/失敗)が使っている
    if(e.evidence==='framework' || e.evidence==='unverified'){
      const a=lay.pos.get(e.from), b=lay.pos.get(e.to);
      const m = document.createElementNS(SVGNS,'text');
      m.setAttribute('x', (a.x+NW+b.x)/2); m.setAttribute('y', (a.y+b.y)/2+NH/2+4);
      m.setAttribute('text-anchor','middle');
      m.setAttribute('class','evmark'+(e.evidence==='unverified'?' q':''));
      m.textContent = e.evidence==='unverified' ? '?' : '◇';
      svg.appendChild(m);
    }
    if(e.label){
      const t = document.createElementNS(SVGNS,'text');
      const a=lay.pos.get(e.from), b=lay.pos.get(e.to);
      t.setAttribute('x', (a.x+NW+b.x)/2); t.setAttribute('y', (a.y+b.y)/2+NH/2-6);
      t.setAttribute('text-anchor','middle'); t.setAttribute('class','elabel');
      t.textContent = e.label.slice(0,26);
      svg.appendChild(t);
      view.labelEls.set(ekey(e.from,e.to), t);
    }
  }
  for(const id of ids){
    const n = NODES.get(id), p = lay.pos.get(id);
    const d = document.createElement('div');
    d.className='node'; d.dataset.id=id;
    d.style.cssText = `left:${p.x}px;top:${p.y}px;width:${NW}px;height:${NH}px;--c:var(--${n.lane})`;
    d.innerHTML = `<span class="bar"></span><span class="idx"></span>`+
      `<div class="nlabel"></div><div class="nmeta"></div>`;
    d.querySelector('.nlabel').textContent = n.label;
    d.querySelector('.nmeta').textContent = n.ref || n.id;
    if (DIFF_NEW.has(id)) d.insertAdjacentHTML('beforeend', `<span class="chg">${STR.chgNew}</span>`);
    else if (DIFF_MOD.has(id)) d.insertAdjacentHTML('beforeend', `<span class="chg mod">${STR.chgMod}</span>`);
    // タッチでは mouseenter だけが来て mouseleave が来ず、ツールチップが残り続ける
    d.addEventListener('mouseenter', ev=>{ if(HOVER) showTip(ev, n); });
    d.addEventListener('mousemove', moveTip);
    d.addEventListener('mouseleave', hideTip);
    d.addEventListener('click', ()=>onNodeClick(id));
    d.style.cursor = 'pointer';
    layer.appendChild(d);
    view.nodeEls.set(id, d);
  }
  applyEdgeLabels();
}
/* レーン名は横スクロールしても左端に貼り付いたままにする */
function drawLaneBar(){
  const bar = document.getElementById('lanebar');
  const l = view.lay; if(!l){ bar.innerHTML=''; return; }
  bar.innerHTML = l.laneBoxes.map(lb=>
    `<span class="lt" style="top:${(lb.top+4)*zoom}px;color:var(--${lb.lane})">${esc(LANE_LABEL[lb.lane])}</span>`).join('');
  bar.style.height = (l.height*zoom)+'px';
  bar.style.transform = `translateX(${wrap.scrollLeft}px)`;
}
wrap.addEventListener('scroll', ()=>{
  document.getElementById('lanebar').style.transform = `translateX(${wrap.scrollLeft}px)`;
}, {passive:true});

function edgePath(a,b){
  const x1=a.x+NW, y1=a.y+NH/2, x2=b.x, y2=b.y+NH/2;
  if(x2>=x1-4){
    const dx=Math.max(38,(x2-x1)*0.45);
    return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
  }
  const lift = 26 + Math.min(120, Math.abs(y2-y1)*0.3);
  return `M${a.x+NW/2},${a.y+NH} C${a.x+NW/2},${a.y+NH+lift} ${b.x+NW/2},${b.y+NH+lift} ${b.x+NW/2},${b.y+NH}`;
}
function showTip(ev,n){
  tip.innerHTML = `<div class="tk" style="--c:var(--${n.lane})">${esc(LANE_LABEL[n.lane])}</div>`+
    `<div class="tt"></div><div class="td"></div>`+(n.ref?`<div class="tr"></div>`:'');
  tip.querySelector('.tt').textContent = n.label;
  tip.querySelector('.td').textContent = n.detail;
  if(n.ref) tip.querySelector('.tr').textContent = n.ref;
  tip.style.opacity=1;
  tip._w = tip.offsetWidth; tip._h = tip.offsetHeight;   // ここで1回だけ測る
  moveTip(ev);
}
function moveTip(ev){
  // 毎 mousemove で offsetWidth を読むと強制同期レイアウトが走り、ノード上を横切るだけでコマ落ちする
  const pad=14, w=tip._w||300, h=tip._h||80;
  let x=ev.clientX+pad, y=ev.clientY+pad;
  if(x+w>innerWidth-8) x=ev.clientX-w-pad;
  if(y+h>innerHeight-8) y=ev.clientY-h-pad;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){ tip.style.opacity=0; }

/* ============================ フロー選択 ============================ */
let cur = null;        // 選択中フロー
let curStep = -1;      // -1 = 全ステップ点灯
let timer = null;
let focusMode = true;      // 既定：選んだ操作の経路だけを一本道に描く
let showLabels = false;
let viewKind = '';         // 'map' か 'flow:<id>'

function flowNodeIds(f){
  const s = [];
  const seen = new Set();
  for(const st of f.steps){ for(const id of [st.from, st.to]) if(!seen.has(id)){ seen.add(id); s.push(id); } }
  return s;
}
function showMap(){
  if(viewKind==='map') return;
  viewKind='map'; render([...NODES.keys()], EDGELIST, true);
}
function showRoute(f){
  if(viewKind==='flow:'+f.id) return;
  viewKind='flow:'+f.id;
  render(flowNodeIds(f), f.steps.map(s=>EDGES.get(ekey(s.from,s.to))).filter(Boolean), false);
}
function selectFlow(f){
  cur = f; curStep = -1; stopPlay();
  dismissHint();
  try{ history.replaceState(null,'','#flow='+encodeURIComponent(f.id)); }catch(e){}
  document.querySelectorAll('button.flowbtn').forEach(b=>b.classList.toggle('sel', b.dataset.id===f.id));
  if(focusMode) showRoute(f); else showMap();
  // 押した瞬間は「起点だけ灯った状態」から始める。
  // curStep=-1 のまま描くと全経路がフル点灯してから暗転し、段階再生の最初の一歩が台無しになる
  curStep = 0;
  paint(); renderPanel(); fit(true);
  if(typeof setPane==='function' && MOBILE()) setPane('map');   // 押したら図へ移る（体験の核をスマホでも通す）
  setTimeout(()=>play(), 260);
}
function clearFlow(){
  cur=null; curStep=-1; stopPlay();
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  document.querySelectorAll('button.flowbtn').forEach(b=>b.classList.remove('sel'));
  showMap();
  paint(); renderPanel(); fit(false);
}
function paint(){
  const nodes = view.nodeEls, edges = view.edgeEls;
  if(!cur){
    nodes.forEach(el=>{ if(el.className!=='node') el.className='node';
      const b=el.querySelector('.idx'); if(b.textContent) b.textContent=''; });
    edges.forEach(p=>{ const c=evCls(p).trim(); if(p.getAttribute('class')!==c) p.setAttribute('class',c); });
    view.painted = null; applyEdgeLabels(); return;
  }
  /* フロー単位で不変な索引は選択のたびに1回だけ作る。
     毎ティックで作り直すと O(ノード数 × 手順数)（638×40 ≒ 25,000回）になり再生がコマ落ちする */
  if(view.painted !== cur.id){
    const order = new Map(), branchOf = new Map(), arriveAt = new Map();
    cur.steps.forEach((s,i)=>{
      for(const id of [s.from,s.to]) if(!order.has(id)) order.set(id, i);
      if(!arriveAt.has(s.to)) arriveAt.set(s.to, i+1);
      const b = s.branch||'main';
      for(const id of [s.from,s.to]){
        const prev = branchOf.get(id);
        if(prev===undefined || (prev!=='main' && b==='main')) branchOf.set(id, b);
      }
    });
    view.order = order; view.branchOf = branchOf;
    const startId = cur.steps[0].from;
    nodes.forEach((el,id)=>{                       // 番号バッジもフロー切替時だけ書く
      const t = order.has(id) ? (id===startId ? STR.badgeStart : (arriveAt.get(id) || STR.badgeSrc)) : '';
      const b = el.querySelector('.idx'); if(b.textContent !== String(t)) b.textContent = t;
    });
    edges.forEach(p=>p.setAttribute('class','faded'+evCls(p)));
    view.hotKeys = []; view.painted = cur.id;
  }
  const order = view.order, branchOf = view.branchOf;
  const upto = curStep<0 ? cur.steps.length-1 : curStep;
  const activeUpto = new Set();
  cur.steps.slice(0, upto+1).forEach(s=>{ activeUpto.add(s.from); activeUpto.add(s.to); });
  const curTo   = curStep>=0 ? cur.steps[curStep].to   : null;
  const curFrom = curStep>=0 ? cur.steps[curStep].from : null;

  nodes.forEach((el,id)=>{
    let cls = 'node';
    if(!order.has(id)) cls += ' dim';
    else {
      const b = branchOf.get(id);
      if(b==='alt') cls += ' altOnly'; else if(b==='error') cls += ' errOnly';
      cls += (activeUpto.has(id) || id===curFrom) ? ' on' : ' pending';
      if(id===curTo) cls += ' cur';
    }
    if(el.className !== cls) el.className = cls;   // 変化した要素だけ触る（全要素の style 再計算を避ける）
  });
  // 前回光らせたエッジだけ戻す（毎ティックの全エッジ書き換えを避ける）
  view.hotKeys.forEach(k=>{ const p=edges.get(k); if(p) p.setAttribute('class','faded'+evCls(p)); });
  const hot = [];
  cur.steps.forEach((s,i)=>{
    const k = ekey(s.from,s.to), p = edges.get(k); if(!p) return;
    const b = s.branch||'main';
    p.setAttribute('class', (i<=upto
      ? 'hot '+(b==='alt'?'alt':b==='error'?'err':'')+(i===curStep?' dash':'')
      : 'pending') + evCls(p));
    hot.push(k);
  });
  view.hotKeys = hot;
  if(curTo){ const el = nodes.get(curTo); if(el) scrollTo(el); }
  // 手順パネルの行だけを対象にする（'.step' だと逆引きパネルの接続行まで光ってしまう）
  const rows = document.querySelectorAll('#apanel .step[data-i]');
  rows.forEach((el,i)=>{
    el.classList.toggle('cur', i===curStep);
    el.classList.toggle('future', curStep>=0 && i>curStep);
  });
  if(curStep>=0 && rows[curStep]) followStep(rows[curStep]);
  const pg = document.getElementById('prog');
  if(pg) pg.innerHTML = curStep>=0 ? STR.showingStep(curStep+1) : STR.showingAll;
  applyEdgeLabels();
}
/* 経路の根拠クラスは分岐の色クラスと共存させる（上書きで消さない） */
const evCls = p => p.dataset.ev ? ' ev-'+p.dataset.ev : '';

/* 再生中、光っている手順が右パネルの画面外に出たままにならないよう追従させる */
function followStep(row){
  const box = document.querySelector('.steps'); if(!box) return;
  const r = row.getBoundingClientRect(), b = box.getBoundingClientRect();
  if(r.top < b.top + 8 || r.bottom > b.bottom - 8){
    // 常に即時。滑らかスクロールにすると再生の間隔に追いつかず、光っている行が画面外に残り続ける。
    // ここは「今どこか」を示すための移動なので、過程を見せる必要もない
    box.scrollTop = box.scrollTop + (r.top - b.top) - box.clientHeight*0.35;
  }
}
function applyEdgeLabels(){
  // 既定では「いま光っているステップ」のラベルだけ出す（全部出すと重なって読めない）
  const curKey = (cur && curStep>=0) ? ekey(cur.steps[curStep].from, cur.steps[curStep].to) : null;
  view.labelEls.forEach((t,k)=>{
    t.setAttribute('class','elabel'+((showLabels || k===curKey)?' show':''));
  });
}
/* 画面外に出たときだけ寄せる。毎ステップ無条件に中央寄せすると図が流れ続けて読めない */
function scrollTo(el){
  const x = el.offsetLeft*zoom, y = el.offsetTop*zoom, w = NW*zoom, h = NH*zoom;
  const L = wrap.scrollLeft, T = wrap.scrollTop, vw = wrap.clientWidth, vh = wrap.clientHeight, pad = 48;
  if(x >= L+pad && x+w <= L+vw-pad && y >= T+pad && y+h <= T+vh-pad) return;
  wrap.scrollTo({ left: Math.max(0, x+w/2-vw/2), top: Math.max(0, y+h/2-vh/2),
                  behavior: motionOK() ? 'smooth' : 'auto' });
}

/* ============================ 再生 ============================ */
function play(){
  if(!cur) return;
  stopPlay();
  curStep = -1;
  document.getElementById('btnPlay').textContent = STR.pause;
  // 長いフローでも再生が終わらなくならないよう、全体が概ね 28 秒に収まる間隔にする
  const base = +document.getElementById('speed').value;
  const sp = Math.max(170, Math.min(base, Math.round(28000/cur.steps.length)));
  const tick = ()=>{
    curStep++;
    if(curStep >= cur.steps.length){ stopPlay(); curStep=-1; paint(); return; }
    paint();
    timer = setTimeout(tick, sp);
  };
  tick();
}
function stopPlay(){
  if(timer){ clearTimeout(timer); timer=null; }
  document.getElementById('btnPlay').textContent = STR.play;
}
function stepBy(d){
  if(!cur) return; stopPlay();
  curStep = Math.max(0, Math.min(cur.steps.length-1, (curStep<0?(d>0?-1:cur.steps.length-1):curStep)+d));
  paint();
}

/* ============================ パネル ============================ */
function renderPanel(){
  const el = document.getElementById('apanel');
  if(!cur){
    el.innerHTML = `<div class="empty">${STR.empty(FLOW_WORD)}</div>`;
    return;
  }
  const st = cur.steps.map((s,i)=>{
    const to = NODES.get(s.to), from = NODES.get(s.from);
    const b = s.branch||'main';
    // 根拠が弱い経路は手順の側にも出す（図の印だけだと見落とす）
    const ed = EDGES.get(ekey(s.from,s.to));
    const ev = ed && ed.evidence && ed.evidence!=='direct' ? ed.evidence : '';
    return `<div class="step b-${b}" data-i="${i}">
      <div class="no">${i+1}</div>
      <div class="body">
        <div class="arrow"><span style="color:var(--${from.lane})">${esc(from.label)}</span><span class="ar">▶</span><span class="to" style="color:var(--${to.lane})">${esc(to.label)}</span></div>
        ${ev?`<div class="evtag ${ev}" title="${esc(STR.evHelp)}">${ev==='unverified'?'? ':ev==='framework'?'◇ ':''}${esc(STR.evLabel[ev]||ev)}</div>`:''}
        ${s.label?`<div class="desc">${esc(s.label)}</div>`:''}
        ${to.detail?`<div class="desc" style="color:var(--fg3)">${esc(to.detail)}</div>`:''}
        ${to.ref?`<div class="ref">${esc(to.ref)}</div>`:''}
      </div></div>`;
  }).join('');
  el.innerHTML = `<div class="ahead">
      <div class="t">${esc(cur.title)}</div>
      <div class="g">${esc(cur.category)} ・ ${STR.steps(cur.steps.length)} <span id="prog"></span></div>
      ${cur.trigger?`<div class="trigger">${STR.trg(FLOW_WORD)}${esc(cur.trigger)}</div>`:''}
    </div>
    <div class="steps">${st}
      ${(cur.notes&&cur.notes.length)?`<div class="notes"><h3>${STR.notes}</h3><ul>${cur.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}
    </div>`;
  el.querySelectorAll('.step').forEach(s=>s.addEventListener('click', ()=>{
    stopPlay(); curStep = +s.dataset.i; paint();
  }));
}
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ノードをクリック：選択中フローならその手順へジャンプ、未選択ならこの処理を通る操作一覧 */
function onNodeClick(id){
  if(cur){
    const i = cur.steps.findIndex(s=>s.to===id);
    const j = i>=0 ? i : cur.steps.findIndex(s=>s.from===id);
    if(j>=0){ stopPlay(); curStep=j; paint();
      const li = document.querySelector(`.step[data-i="${j}"]`); if(li) li.scrollIntoView({block:'center',behavior:'smooth'});
      return; }
  }
  showNodePanel(id);
}
function showNodePanel(id){
  const n = NODES.get(id);
  const via = FLOWS.filter(f=>f.steps.some(s=>s.from===id||s.to===id));
  const ins = EDGELIST.filter(e=>e.to===id), outs = EDGELIST.filter(e=>e.from===id);
  const row = e => {
    const o = NODES.get(e.from===id? e.to : e.from);
    return `<div class="step"><div class="no" style="border-color:var(--${o.lane});color:var(--${o.lane})">${e.from===id?'→':'←'}</div>
      <div class="body"><div class="arrow"><span class="to">${esc(o.label)}</span></div>
      ${e.label?`<div class="desc">${esc(e.label)}</div>`:''}${o.ref?`<div class="ref">${esc(o.ref)}</div>`:''}</div></div>`;
  };
  document.getElementById('apanel').innerHTML = `
    <div class="ahead">
      <div class="t" style="color:var(--${n.lane})">${esc(n.label)}</div>
      <div class="g">${esc(LANE_LABEL[n.lane])} ・ <code style="font-size:10px">${esc(n.id)}</code></div>
      ${n.detail?`<div class="trigger" style="color:var(--fg2);background:var(--chip);border-color:var(--line2)">${esc(n.detail)}</div>`:''}
      ${n.ref?`<div class="g" style="margin-top:6px;font-family:ui-monospace,monospace">${esc(n.ref)}</div>`:''}
    </div>
    <div class="steps">
      <div class="cat"><h2 style="margin:4px 0 6px">${STR.through(FLOW_WORD, via.length)}</h2></div>
      ${via.map(f=>`<div class="step" data-f="${esc(f.id)}"><div class="no">▶</div><div class="body">
        <div class="arrow"><span class="to">${esc(f.title)}</span></div><div class="desc">${esc(f.category)}</div></div></div>`).join('') || `<div class="desc" style="padding:4px 8px;color:var(--fg3)">${STR.none}</div>`}
      <div class="cat"><h2 style="margin:14px 0 6px">${STR.conn(ins.length, outs.length)}</h2></div>
      ${[...ins.map(row), ...outs.map(row)].join('')}
    </div>`;
  document.querySelectorAll('.step[data-f]').forEach(el=>el.addEventListener('click',()=>{
    const f = FLOWS.find(x=>x.id===el.dataset.f); if(f) selectFlow(f);
  }));
  view.nodeEls.forEach((el,i)=>el.classList.toggle('hit', i===id));
  if(typeof setPane==='function' && MOBILE()) setPane('steps');   // 逆引きの結果は手順ペインに出る
}

/* ============================ デッキ（ボタン） ============================ */
function renderDeck(){
  const byCat = new Map();
  for(const f of FLOWS){
    const c = f.category || 'その他';
    if(!byCat.has(c)) byCat.set(c, []);
    byCat.get(c).push(f);
  }
  const cats = [...byCat.keys()].sort((a,b)=>{
    const ia=CAT_ORDER.indexOf(a), ib=CAT_ORDER.indexOf(b);

  document.getElementById('deck').innerHTML = `<div class="catgrid">${cats.map(c=>`
    <div class="cat"><h2>${esc(c)}</h2><div class="btns">${byCat.get(c).map(f=>`
      <button class="flowbtn" data-id="${esc(f.id)}" data-s="${esc((f.title+' '+(f.trigger||'')+' '+f.steps.map(s=>NODES.get(s.to).label+' '+(NODES.get(s.to).ref||'')).join(' ')).toLowerCase())}">
        ${esc(f.title)}${DIFF_FLOW_NEW.has(f.id)?`<span class="fchip">${STR.chgNew}</span>`:DIFF_FLOW_MOD.has(f.id)?`<span class="fchip mod">${STR.chgMod}</span>`:''}${f.trigger?`<span class="trg">${esc(f.trigger)}</span>`:''}
      </button>`).join('')}</div></div>`).join('')}</div>`;
  document.querySelectorAll('button.flowbtn').forEach(b=>b.addEventListener('click',()=>{

/* ============================ 検索 ============================ */
document.getElementById('q').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();

/* ============================ ズーム ============================ */
function setZoom(z){
  zoom = Math.max(0.2, Math.min(1.8, z));
  layer.style.transform = `scale(${zoom})`;
  const l = view.lay;
  if(l){
    // canvas のレイアウト寸法を表示倍率に合わせる。これがそのままスクロール範囲になる。
    // 拡縮は内側 zoomlayer の transform に掛け、canvas 自身は変形しない
    // （同じ要素に transform と実寸を両方持たせると box が二重に縮尺されてスクロールが壊れる）
    canvas.style.width = (l.width*zoom)+'px';
    canvas.style.height = (l.height*zoom)+'px';
  }
  drawLaneBar();
}
let pendingFit = null;
function fit(soft){
  const l = view.lay; if(!l) return;
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  // 非表示のペインや高さ0の iframe では clientWidth が 0 になり、倍率が下限に張り付いてしまう。
  // 表示に戻ったときに fit し直せるよう覚えておく
  if(vw < 40 || vh < 40){ pendingFit = soft; return; }
  pendingFit = null;
  const z = Math.min(1.2, (vw-28)/l.width, (vh-28)/l.height);
  // soft = 文字が読める大きさを優先（縮めすぎない）。「全体を表示」だけは真にフィットさせる。
  setZoom(soft ? Math.max(0.62, Math.min(1.05, z)) : Math.max(0.16, z));
  if(soft && cur){
    const first = view.nodeEls.get(cur.steps[0].from);
    if(first) setTimeout(()=>scrollTo(first), 30);
  } else if(!soft) wrap.scrollTo({left:0, top:0});
}

/* ============================ パン・ズーム（マウスとタッチ共通） ============================ */
/* Pointer Events に統一する。mouse 専用にすると、touch-action:none を指定した時点で
   スマホからは図をまったく動かせなくなる。2本指はピンチズームに割り当てる */
const ptrs = new Map();
let pan = null, pinch = null, suppressClick = false;
wrap.style.cursor = 'grab';
wrap.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    pan = { x: e.clientX, y: e.clientY, sl: wrap.scrollLeft, st: wrap.scrollTop, moved: false,
            touch: e.pointerType !== 'mouse' };
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    wrap.style.cursor = 'grabbing';
  } else if (ptrs.size === 2) {
    pan = null;
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: zoom };
  }
  e.preventDefault();   // テキスト選択・ネイティブドラッグ・スクロールを抑止
});
wrap.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.z * (d / pinch.d));
    return;
  }
  if (!pan) return;
  const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
  // 指はマウスより滑るので、タップをドラッグと誤認しないよう閾値を上げる
  const th = pan.touch ? 8 : 4;
  if (Math.abs(dx) > th || Math.abs(dy) > th) pan.moved = true;
  if (pan.moved) { wrap.scrollLeft = pan.sl - dx; wrap.scrollTop = pan.st - dy; }
});
function endPointer(e){
  ptrs.delete(e.pointerId);
  if (pan) {
    suppressClick = pan.moved;
    pan = null;
    wrap.style.cursor = 'grab';
    setTimeout(() => { suppressClick = false; }, 0);
  }
  if (ptrs.size < 2) pinch = null;
  // 2本指の片方を離したら、残った指でパンを続けられるようにする
  if (ptrs.size === 1) {
    const [p] = [...ptrs.values()];
    pan = { x: p.x, y: p.y, sl: wrap.scrollLeft, st: wrap.scrollTop, moved: false, touch: true };
  }
}
wrap.addEventListener('pointerup', endPointer);
wrap.addEventListener('pointercancel', endPointer);
wrap.addEventListener('click', e => {
  if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; }
}, true);

/* カーソル位置を不動点にした拡縮（Ctrl+ホイール／トラックパッドのピンチ） */
function zoomAt(clientX, clientY, nz){
  const rect = wrap.getBoundingClientRect();
  const px = clientX - rect.left, py = clientY - rect.top;
  const cx = (wrap.scrollLeft + px) / zoom, cy = (wrap.scrollTop + py) / zoom;
  setZoom(nz);
  wrap.scrollLeft = cx * zoom - px;
  wrap.scrollTop  = cy * zoom - py;
}
wrap.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;   // 素のホイールは通常スクロールのまま
  e.preventDefault();       // ブラウザのページ拡大を抑止
  zoomAt(e.clientX, e.clientY, zoom * (e.deltaY < 0 ? 1.13 : 1/1.13));
}, { passive: false });

/* ============================ ヘッダ・凡例・キー ============================ */
document.getElementById('stat').innerHTML =
  STR.stat(FLOW_WORD, FLOWS.length, NODES.size, EDGELIST.length)
  + (DIFF ? STR.diffStat(DIFF.addedNodes.length, DIFF.changedNodes.length) : '');

if (STAMP.refTotal) stampBits.push(STR.stampRefs(STAMP.refOk, STAMP.refTotal));

  const e = STAMP.evidence;

}
/* creditUrl は http(s) のみリンク化する（javascript: 等のスキームを弾く） */
const creditHref = /^https?:\/\//i.test(String(META.creditUrl || '')) ? META.creditUrl : null;

  (creditHref
    ? `<a href="${esc(creditHref)}" target="_blank" rel="noopener" style="color:var(--fg3)">Generated with visual-flow-map</a>`
    : `<span>Generated with visual-flow-map</span>`);
/* 図の対象が他者のプロジェクトなら、その出典を図の中に持たせる。
   この HTML は単体で配られるので、リポジトリの README に書いてあっても受け手には届かない */
const SUBJ = META.subject || null;
const subjectCredit = SUBJ && SUBJ.name
  ? `<span class="lg" style="color:var(--fg3)">${STR.subjectOf}: `
    + (/^https?:\/\//i.test(String(SUBJ.url || ''))
        ? `<a href="${esc(SUBJ.url)}" target="_blank" rel="noopener" style="color:var(--fg2)">${esc(SUBJ.name)}</a>`
        : esc(SUBJ.name))
    + (SUBJ.license ? `（${esc(SUBJ.license)}）` : '')
    + (SUBJ.commit ? ` @${esc(SUBJ.commit)}` : '') + `</span>`
  : '';
document.getElementById('legend').innerHTML =
  LANES.filter(([k])=>[...NODES.values()].some(n=>n.lane===k))
    .map(([k,v])=>`<span class="lg" style="--c:var(--${k})"><i class="dot"></i>${esc(v)}</span>`).join('')
  + `<span style="flex:1"></span>`
  + `<span class="lg" style="--c:var(--main)"><i class="dot"></i>${STR.lgMain}</span>`
  + `<span class="lg" style="--c:var(--alt)"><i class="dot"></i>${STR.lgAlt}</span>`
  + `<span class="lg" style="--c:var(--err)"><i class="dot"></i>${STR.lgErr}</span>`
  + (STAMP.evidence && (STAMP.evidence.framework || STAMP.evidence.unverified)
      ? `<span class="lg" title="${esc(STR.evHelp)}" style="color:var(--fg3)">`
        + (STAMP.evidence.framework ? `◇ ${esc(STR.evLabel.framework)}　` : '')
        + (STAMP.evidence.unverified ? `<b style="color:var(--alt)">?</b> ${esc(STR.evLabel.unverified)}` : '')
        + `</span>` : '')
  + `<button class="lg themebtn" id="btnTheme" title="${esc(STR.themeToggle)}"
       style="background:none;border:1px solid var(--line2);border-radius:7px;padding:3px 9px;
              color:var(--fg3);cursor:pointer;font-family:inherit;font-size:10px">◐</button>`
  + subjectCredit
  + ((stampBits.length || credit)
    ? `<span class="lg" style="color:var(--fg3)">${stampBits.join(' ・ ')}${stampBits.length && credit ? ' ・ ' : ''}${credit}</span>`
    : '');

document.getElementById('btnPlay').onclick = ()=> timer ? (stopPlay(), paint()) : play();
document.getElementById('btnPrev').onclick = ()=> stepBy(-1);
document.getElementById('btnNext').onclick = ()=> stepBy(1);
document.getElementById('btnClear').onclick = clearFlow;
document.getElementById('btnFit').onclick = ()=> fit(false);
const zoomAtCenter = f => { const r = wrap.getBoundingClientRect(); zoomAt(r.left + r.width/2, r.top + r.height/2, zoom * f); };
document.getElementById('btnZoomIn').onclick = ()=> zoomAtCenter(1.18);
document.getElementById('btnZoomOut').onclick = ()=> zoomAtCenter(1/1.18);
document.getElementById('btnFold').onclick = e=>{
  const d = document.getElementById('deck');
  const folded = d.classList.toggle('folded');
  e.currentTarget.classList.toggle('on', folded);
  e.currentTarget.textContent = folded ? STR.foldShow(FLOW_WORD) : STR.foldHide(FLOW_WORD);
  setTimeout(()=>{ setZoom(zoom); if(cur) fit(true); }, 280);
};
document.getElementById('btnLabels').onclick = e=>{
  showLabels = !showLabels; e.currentTarget.classList.toggle('on', showLabels); applyEdgeLabels();
};
document.getElementById('btnOnly').onclick = e=>{
  focusMode = !focusMode;
  e.currentTarget.classList.toggle('on', !focusMode);
  e.currentTarget.textContent = focusMode ? STR.overlayOn : STR.overlayOff;
  if(cur){ if(focusMode) showRoute(cur); else showMap(); paint(); fit(true); }
  else showMap();
};
addEventListener('keydown', e=>{
  const tag = e.target.tagName;
  if(e.key==='Escape'){                      // 検索窓からも必ず抜けられるようにする
    if(tag==='INPUT'){ e.target.value=''; e.target.dispatchEvent(new Event('input',{bubbles:true})); e.target.blur(); }
    else clearFlow();
    e.preventDefault(); return;
  }
  if(tag==='INPUT'||tag==='SELECT') return;
  if(tag==='BUTTON' && (e.key===' '||e.key==='Enter')) return;  // ボタン自身の起動を奪わない
  if(e.key==='ArrowRight'){ e.preventDefault(); stepBy(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); stepBy(-1); }
  else if(e.key===' '){ e.preventDefault(); timer? (stopPlay(),paint()) : play(); }
});
addEventListener('resize', ()=>{ setZoom(zoom); if(pendingFit!==null) fit(pendingFit); });

/* ============================ 初回ヒント ============================ */
// file:// では全ての図が同一オリジンを共有するので、図ごとに名前空間を切らないと
// 2枚目以降を受け取った人にヒントが一度も出ない
const HINT_KEY = 'flowmap:hint:' + (META.title || 'default');
function showHintOnce(){
  let seen = false;
  try{ seen = !!localStorage.getItem(HINT_KEY); }catch(e){}
  if(seen || !FLOWS.length) return;
  const d = document.createElement('div');
  d.id = 'hint';
  d.innerHTML = STR.hint(FLOW_WORD) + `<span class="x" title="close">✕</span>`;
  document.body.appendChild(d);
  const r = document.getElementById('deck').getBoundingClientRect();
  d.style.left = Math.max(16, r.left + 16) + 'px';
  d.style.top = Math.max(60, r.top + 10) + 'px';
  d.querySelector('.x').addEventListener('click', dismissHint);
  setTimeout(dismissHint, 15000);
}
function dismissHint(){
  const d = document.getElementById('hint');
  if(d) d.remove();
  try{ localStorage.setItem(HINT_KEY,'1'); }catch(e){}
}

/* ============================ 起動 ============================ */
// meta.lang に合わせて html の言語も切り替える。
// ここがずれていると、スクリーンリーダーが英語のUIを日本語として読み上げる
document.documentElement.lang = LANG;
document.title = META.title || STR.defaultTitle;
{ const m = document.querySelector('h1 .mark'); if(m) m.textContent = META.title || STR.defaultTitle; }
document.querySelector('header .sub').textContent = STR.subtitle;
// concept モードは誤読の危険が大きいので、副題そのものを差し替えて常時見えるようにする
if(MODE!=='code') document.querySelector('header .sub').textContent = STR.subtitle + '（' + MODE_NOTE + '）';
{ const b=document.getElementById('btnTheme');
  if(b) b.onclick=()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light', true); }
document.getElementById('q').placeholder = STR.searchPh(FLOW_WORD);
document.getElementById('btnFold').textContent = STR.foldHide(FLOW_WORD);
document.getElementById('btnOnly').textContent = STR.overlayOn;
document.getElementById('btnLabels').textContent = STR.edgeLabels;
document.getElementById('btnPlay').textContent = STR.play;
document.getElementById('btnPrev').textContent = STR.prev;
document.getElementById('btnNext').textContent = STR.next;
document.getElementById('btnFit').textContent = STR.fit;
document.getElementById('btnClear').textContent = STR.clear;
{ const so = document.getElementById('speed').options;
  if (so.length === 3) { so[0].textContent = STR.spSlow; so[1].textContent = STR.spStd; so[2].textContent = STR.spFast; } }
renderDeck();
showMap();
renderPanel();
fit(false);
/* ============================ スマホのペイン切替 ============================ */
/* スマホは同時表示を捨てて1画面1役にする。図は非表示中に幅0になるので、戻った直後に必ず再フィットする */
const APP = document.getElementById('app');
function setPane(p){
  APP.dataset.pane = p;
  document.querySelectorAll('.pane').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.pane===p)));
  // 非表示だった間は clientWidth が 0 なので、offsetHeight を読んでレイアウトを確定させてから測る
  if(p==='map'){ void wrap.offsetHeight; setZoom(zoom); fit(!!cur); }
}
{
  const L = LANG==='en' ? ['List','Map','Steps'] : [FLOW_WORD+'一覧','図','手順'];
  document.querySelectorAll('.pane').forEach((b,i)=>{ b.textContent = L[i]; b.onclick = ()=>setPane(b.dataset.pane); });
  // data-pane が無いとスマホでは全ペインが display:none のままになるので、描画前に必ず入れる
  APP.dataset.pane = 'map';
  setPane('map');
}

/* ディープリンク（#flow=<id>）で開かれたら、そのフローを選択した状態で始める */
(function initFromHash(){
  let f = null;
  const m = location.hash.match(/^#flow=(.+)$/);
  if(m){ try{ f = FLOWS.find(x => x.id === decodeURIComponent(m[1])); }catch(e){} }
  if(f) selectFlow(f); else showHintOnce();
})();
</script>
