itorList by $route.params.id (no new fetch)","ref":"src/pages/Details.vue:504"},{"id":"app.monitorlist.pauseSelected","lane":"app","label":"Bulk pause emit","detail":"Sends pauseMonitor one by one to the selected running monitors","ref":"src/components/MonitorList.vue:450"},{"id":"app.monitorlist.resumeSelected","lane":"app","label":"Bulk resume emit","detail":"Sends resumeMonitor one by one to the selected paused monitors","ref":"src/components/MonitorList.vue:474"},{"id":"app.monitorlist.deleteSelected","lane":"app","label":"Bulk delete emit","detail":"Sends deleteMonitor(id,false,cb) one by one to the selected monitors","ref":"src/components/MonitorList.vue:497"},{"id":"api.socket.add","lane":"api","label":"add received","detail":"Detaches notificationIDList from the monitor before bean.import. The links are created after the save.","ref":"server/server.js:743"},{"id":"api.socket.editMonitor","lane":"api","label":"Edit a monitor","detail":"After the save, updateMonitorNotification rebuilds the notification links, and a running monitor is restarted.","ref":"server/server.js:818"},{"id":"api.socket.getMonitorList","lane":"api","label":"getMonitorList received","detail":"Handler for an explicit request to refetch the list","ref":"server/server.js:995"},{"id":"api.socket.getMonitor","lane":"api","label":"getMonitor received","detail":"Fetches one monitor (used to fill the edit/clone form)","ref":"server/server.js:1011"},{"id":"api.socket.resumeMonitor","lane":"api","label":"resumeMonitor received","detail":"Handler for starting or resuming a monitor","ref":"server/server.js:1089"},{"id":"api.socket.pauseMonitor","lane":"api","label":"pauseMonitor received","detail":"Handler for pausing a monitor","ref":"server/server.js:1108"},{"id":"api.socket.deleteMonitor","lane":"api","label":"deleteMonitor received","detail":"Handler for deleting a monitor. For a group, the fate of the children can be chosen","ref":"server/server.js:1127"},{"id":"svc.server.checkOwner","lane":"svc","label":"Check owner","detail":"Checks that the given monitorID exists under that user_id. Throws if it does not","ref":"server/server.js:1813"},{"id":"svc.server.updateMonitorNotification","lane":"svc","label":"Rebuild the links","detail":"DELETEs every monitor_notification row for the monitor, then re-INSERTs only the IDs marked true.","ref":"server/server.js:1793"},{"id":"svc.server.startMonitor","lane":"svc","label":"Start / resume","detail":"Sets active=1 and, if an instance already exists, stops it before starting again","ref":"server/server.js:1901"},{"id":"svc.server.restartMonitor","lane":"svc","label":"Restart","detail":"After clearing the statistics, a monitor that is active is stopped and started again to reset the UptimeCalculator state","ref":"server/server.js:1924"},{"id":"svc.server.pauseMonitor","lane":"svc","label":"Pause","detail":"Sets active=0 and stops the running instance if there is one","ref":"server/server.js:1934"},{"id":"svc.server.sendMonitorList","lane":"svc","label":"Send the list","detail":"Sends the monitor list on monitorList after login. The \"Add a monitor\" choices in edit mode come from this list.","ref":"server/uptime-kuma-server.js:222"},{"id":"svc.server.sendUpdateMonitorIntoList","lane":"svc","label":"Send the update diff","detail":"Builds the monitor's latest data and sends updateMonitorIntoList to that user's sockets","ref":"server/uptime-kuma-server.js:234"},{"id":"svc.server.sendDeleteMonitorFromList","lane":"svc","label":"Send the delete notice","detail":"Broadcasts just the ID on the deleteMonitorFromList event","ref":"server/uptime-kuma-server.js:247"},{"id":"svc.server.getMonitorJSONList","lane":"svc","label":"Build the list JSON","detail":"Finds the monitors matching user_id and shapes them with toJSON, including the preloaded tags and the rest","ref":"server/uptime-kuma-server.js:259"},{"id":"svc.monitor.toJSON","lane":"svc","label":"To JSON","detail":"Turns one DB row into the object the screen renders","ref":"server/model/monitor.js:116"},{"id":"svc.monitor.preparePreloadData","lane":"svc","label":"Prepare preload data","detail":"Preloads and shapes notifications, tags, maintenance state and more for several monitors at once","ref":"server/model/monitor.js:1820"},{"id":"svc.monitor.isActive","lane":"svc","label":"Active check","detail":"Combines its own active flag with the parent's state to decide whether it really runs","ref":"server/model/monitor.js:1302"},{"id":"svc.monitor.getAllChildrenIDs","lane":"svc","label":"List child IDs","detail":"Recursively collects the IDs of every descendant monitor","ref":"server/model/monitor.js:1956"},{"id":"svc.monitor.getChildren","lane":"svc","label":"Get children","detail":"Fetches the rows whose parent is the given ID","ref":"server/model/monitor.js:1919"},{"id":"svc.monitor.unlinkAllChildren","lane":"svc","label":"Unlink the children","detail":"Sets the children's parent to null (ungroups them)","ref":"server/model/monitor.js:1978"},{"id":"svc.monitor.deleteMonitor","lane":"svc","label":"Delete one","detail":"Stops the instance if it is running, then deletes the row from the monitor table","ref":"server/model/monitor.js:1988"},{"id":"svc.monitor.deleteMonitorRecursively","lane":"svc","label":"Recursive delete","detail":"For a group, recursively deletes the children first and then itself","ref":"server/model/monitor.js:2007"},{"id":"svc.monitor.start","lane":"svc","label":"Start monitoring","detail":"Monitor.start(). Initializes previousBeat/retries and defines beat/safeBeat. Everything except push type runs safeBeat() immediately","ref":"server/model/monitor.js:414"},{"id":"svc.monitor.stop","lane":"svc","label":"Stop monitoring","detail":"Clears the setTimeout and sets isStop=true to end the loop","ref":"server/model/monitor.js:1211"},{"id":"job.monitor.beat","lane":"job","label":"Run a heartbeat","detail":"One heartbeat run. Checks the target according to its type, records the outcome in the heartbeat and carries on through the DB save, the notification and the next schedule","ref":"server/model/monitor.js:426"},{"id":"db.monitor","lane":"db","label":"monitor","detail":"The monitor itself: id / active / parent / user_id and more. user_id is ON DELETE SET NULL","ref":"db/knex_init_db.js:66"},{"id":"db.heartbeat","lane":"db","label":"heartbeat","detail":"The check results. The public page reads the last 100, while the badge and the RSS read only the latest one, by time descending.","ref":"db/knex_init_db.js:125"},{"id":"db.monitor_notification","lane":"db","label":"monitor_notification table","detail":"The join table of monitor_id x notification_id. ON DELETE CASCADE when the monitor is deleted","ref":"db/knex_init_db.js:306"},{"id":"job.monitor.safeBeat","lane":"job","label":"Schedule the next beat","detail":"Schedules the next run only after the whole pass, including sending notifications, has finished. A slow target delays the entire beat.","ref":"server/model/monitor.js:1091"},{"id":"svc.monitor.isUnderMaintenance","lane":"svc","label":"Under maintenance?","detail":"Looks at every linked maintenance and is true if any one is running. If a parent group is a target, its children are recursively true as well","ref":"server/model/monitor.js:1596"},{"id":"svc.maintenance.isUnderMaintenance","lane":"svc","label":"Under maintenance?","detail":"A boolean that only looks at whether the status is under-maintenance. Both the monitoring side and the status page side use it","ref":"server/model/maintenance.js:394"},{"id":"svc.monitorType.check","lane":"svc","label":"Per-type check contract","detail":"check() on the MonitorType base class. Every subclass overrides it with the real check (not overriding it throws)","ref":"server/monitor-types/monitor-type.js:33"},{"id":"svc.tcp.check","lane":"svc","label":"TCP check","detail":"TCPMonitorType.check(). Confirms the port with tcp-ping and sets UP; throws on failure","ref":"server/monitor-types/tcp.js:106"},{"id":"svc.dns.check","lane":"svc","label":"DNS check","detail":"DnsMonitorType.check(). Resolves the name and returns UP if it matches the condition, otherwise throws","ref":"server/monitor-types/dns.js:22"},{"id":"ext.http_target","lane":"ext","label":"HTTP target site","detail":"The target axios sends the HTTP request to. Judged by status code or keyword","ref":"server/model/monitor.js:649"},{"id":"ext.tcp_target","lane":"ext","label":"TCP target host","detail":"The host whose port is probed with tcp-ping","ref":"server/monitor-types/tcp.js:127"},{"id":"ext.dns_target","lane":"ext","label":"DNS resolver","detail":"The server the name resolution request is sent to","ref":"server/monitor-types/dns.js:27"},{"id":"svc.monitor.isImportantBeat","lane":"svc","label":"Important transition check","detail":"Decides bean.important: is this the first beat, or an important transition between UP/DOWN/PENDING/MAINTENANCE?","ref":"server/model/monitor.js:1385"},{"id":"svc.monitor.isImportantForNotification","lane":"svc","label":"Notify-worthy check","detail":"True only for the first beat, UP to DOWN, DOWN to UP, PENDING to DOWN and MAINTENANCE to DOWN. Entering maintenance (UP/DOWN to MAINTENANCE) and leaving it (MAINTENANCE to UP) are not notified","ref":"server/model/monitor.js:1420"},{"id":"svc.monitor.sendNotification","lane":"svc","label":"Notify the state change","detail":"Runs only when !isFirstBeat or the status is DOWN. The message is [name][🔴 Down / ✅ Up] reason. It adds the timezone and other details and sends to each target in turn.","ref":"server/model/monitor.js:1452"},{"id":"svc.monitor.getNotificationList","lane":"svc","label":"Get the notification list","detail":"Joins monitor_notification with notification and returns only the targets linked to that monitor.","ref":"server/model/monitor.js:1526"},{"id":"svc.notification.send","lane":"svc","label":"Notification dispatch","detail":"If providerList[type] is missing: \"Notification type is not supported\". Otherwise it calls that provider's send.","ref":"server/notification.js:250"},{"id":"ext.notification_provider","lane":"ext","label":"Notification service","detail":"The external notification service or webhook (Discord and the like) the provider's send() actually hits","ref":"server/notification.js:252"},{"id":"svc.uptime.getUptimeCalculator","lane":"svc","label":"Get the uptime calculator","detail":"Returns the UptimeCalculator cached in memory per monitor (creating it if there is none)","ref":"server/uptime-calculator.js:72"},{"id":"svc.uptime.update","lane":"svc","label":"Update the uptime data","detail":"Adds up/down/maintenance counts and the average ping into the minute/hour/day buckets and, outside the test environment, writes them to the DB","ref":"server/uptime-calculator.js:212"},{"id":"svc.uptime.getData","lane":"svc","label":"Aggregate the uptime data","detail":"Reached through get24Hour/30Day/1Year. Sums up/down/ping over the period and works out the uptime %","ref":"server/uptime-calculator.js:563"},{"id":"svc.monitor.sendStats","lane":"svc","label":"Push the stats to the UI","detail":"If a client is connected to the user's room, pushes avgPing / uptime / certificate / domain info over the socket","ref":"server/model/monitor.js:1315"},{"id":"db.monitor_tls_info","lane":"db","label":"TLS certificate info","detail":"Holds the latest TLS certificate info (info_json) per monitor","ref":"db/knex_init_db.js:359"},{"id":"db.notification_sent_history","lane":"db","label":"Notification send history","detail":"Records certificate and domain expiry notices already sent (type / monitor_id / days). Prevents duplicates","ref":"db/knex_init_db.js:373"},{"id":"db.monitor_maintenance","lane":"db","label":"monitor_maintenance","detail":"Links a maintenance to its target monitors. Cascades away when the maintenance is deleted","ref":"db/knex_init_db.js:272"},{"id":"db.notification","lane":"db","label":"notification table","detail":"name / user_id / is_default / config. config holds the entire form input as JSON (tokens and passwords in plaintext too).","ref":"db/knex_init_db.js:296"},{"id":"db.stat_minutely","lane":"db","label":"stat_minutely table","detail":"Holds the per-minute aggregates for each monitor","ref":"db/knex_migrations/2023-08-16-0000-create-uptime.js:3"},{"id":"db.stat_hourly","lane":"db","label":"stat_hourly table","detail":"Holds the per-hour aggregates for each monitor","ref":"db/knex_migrations/2023-12-22-0000-hourly-uptime.js:2"},{"id":"db.stat_daily","lane":"db","label":"stat_daily table","detail":"Holds the per-day aggregates for each monitor","ref":"db/knex_migrations/2023-08-16-0000-create-uptime.js:21"},{"id":"svc.monitor.handleTlsInfo","lane":"svc","label":"Receive the TLS info","detail":"After saving the TLS info it moves on to the expiry check only when ignoreTls is off and certificate expiry notices are enabled.","ref":"server/model/monitor.js:2072"},{"id":"svc.monitor.updateTlsInfo","lane":"svc","label":"Save the TLS certificate info","detail":"Saves into monitor_tls_info. If the fingerprint changed, the certificate's send history is deleted","ref":"server/model/monitor.js:1258"},{"id":"svc.utilServer.checkCertExpiryNotifications","lane":"svc","label":"Check certificate expiry","detail":"Returns immediately when there are no targets. For each tlsExpiryNotifyDays value (7/14/21 by default) it walks the certificate chain, skipping known roots.","ref":"server/util-server.js:924"},{"id":"svc.monitor.sendCertNotificationByTargetDays","lane":"svc","label":"Notify certificate expiry","detail":"Sends nothing if notification_sent_history already holds a matching record. If even one send succeeds, it INSERTs the history row.","ref":"server/model/monitor.js:1544"},{"id":"svc.domainExpiry.checkSupport","lane":"svc","label":"Domain expiry supported?","detail":"Works out the domain from the monitor type and hostname/url, then checks it is under ICANN and its TLD supports RDAP","ref":"server/model/domain_expiry.js:211"},{"id":"svc.domainExpiry.checkExpiry","lane":"svc","label":"Fetch the domain expiry","detail":"Gets or creates the domain_expiry row and, if the last check was over a day ago, refetches from RDAP and updates the expiry date","ref":"server/model/domain_expiry.js:278"},{"id":"svc.domainExpiry.sendNotifications","lane":"svc","label":"Domain expiry notice check","detail":"Compares the days remaining against each configured threshold (7/14/21 by default) and calls sendDomainNotificationByTargetDays if nothing was sent","ref":"server/model/domain_expiry.js:309"},{"id":"svc.domainExpiry.sendDomainNotificationByTargetDays","lane":"svc","label":"Send the domain expiry notice","detail":"Calls Notification.send() for every notification target","ref":"server/model/domain_expiry.js:150"},{"id":"db.domain_expiry","lane":"db","label":"domain_expiry table","detail":"Holds the expiry date, the last check date and the last notified day count per domain","ref":"db/knex_migrations/2025-09-02-0000-add-domain-expiry.js:6"},{"id":"ext.rdap_server","lane":"ext","label":"RDAP server","detail":"The external RDAP server fetched over HTTP for the domain's expiry date","ref":"server/model/domain_expiry.js:121"},{"id":"ext.iana_rdap_directory","lane":"ext","label":"IANA RDAP directory","detail":"External data listing the RDAP server for each TLD (cached weekly)","ref":"server/model/domain_expiry.js:54"},{"id":"ui.settings_notifications.setup_btn","lane":"ui","label":"Setup notification button","detail":"\"Setup Notification\" under Settings > Notifications. Pressing it opens NotificationDialog with no argument, i.e. in create mode.","ref":"src/components/settings/Notifications.vue:19"},{"id":"ui.settings_notifications.edit_link","lane":"ui","label":"Edit link for a notification target","detail":"Edit on each row of the list. Passes notification.id and opens NotificationDialog in edit mode.","ref":"src/components/settings/Notifications.vue:15"},{"id":"ui.notificationdialog.show","lane":"ui","label":"Open the notification dialog","detail":"With an ID it JSON.parses the config from $root.notificationList and restores it. Without one, it is an empty form with type=telegram.","ref":"src/components/NotificationDialog.vue:427"},{"id":"ui.notificationdialog.type_select","lane":"ui","label":"Notification type select","detail":"Nine optgroup categories. Choosing one swaps currentForm and renders the form for that type.","ref":"src/components/NotificationDialog.vue:15"},{"id":"ui.notificationdialog.save_btn","lane":"ui","label":"Save button","detail":"type=submit, reached through the form's @submit.prevent=\"submit\". Disabled while processing.","ref":"src/components/NotificationDialog.vue:147"},{"id":"ui.notificationdialog.test_btn","lane":"ui","label":"Test button","detail":"Sends a test with the values currently in the form, without saving. It works even while creating a new one.","ref":"src/components/NotificationDialog.vue:144"},{"id":"ui.notificationdialog.delete_btn","lane":"ui","label":"Delete button","detail":"v-if=\"id\", so it only shows in edit mode. Pressing it closes the modal and opens the confirm dialog.","ref":"src/components/NotificationDialog.vue:135"},{"id":"ui.notificationdialog.confirm_delete","lane":"ui","label":"Delete confirm dialog","detail":"The Confirm component. @yes calls deleteNotification. No does nothing.","ref":"src/components/NotificationDialog.vue:157"},{"id":"ui.notificationdialog.apply_existing_switch","lane":"ui","label":"Apply to all existing monitors","detail":"applyExisting. Links the notification to every monitor once, at save time. A transient flag that is never stored in the DB.","ref":"src/components/NotificationDialog.vue:128"},{"id":"ui.apprise.status","lane":"ui","label":"Apprise install status","detail":"If appriseInstalled is true it says installed; if false it shows a link explaining how to install it.","ref":"src/components/notifications/Apprise.vue:18"},{"id":"ui.editmonitor.notification_checkbox","lane":"ui","label":"Notification target checkbox","detail":"Puts true/false into monitor.notificationIDList[id]. One checkbox per notification target.","ref":"src/pages/EditMonitor.vue:2211"},{"id":"ui.editmonitor.setup_notification_btn","lane":"ui","label":"Add a notification from the monitor form","detail":"Opens the same NotificationDialog from the monitor edit screen. Whatever you add gets checked automatically.","ref":"src/pages/EditMonitor.vue:2229"},{"id":"ui.editmonitor.resend_interval","lane":"ui","label":"Resend count setting","detail":"resendInterval. How many beats it stays DOWN before resending. 0 means never resend.","ref":"src/pages/EditMonitor.vue:1665"},{"id":"app.notificationdialog.submit","lane":"app","label":"Save the notification target","detail":"Emits addNotification. On ok it closes and shows a toast. Only a new one emits the added event to the parent.","ref":"src/components/NotificationDialog.vue:457"},{"id":"app.notificationdialog.test","lane":"app","label":"Send a test","detail":"Sends the unsaved notification object straight through testNotification. The result is only a toast.","ref":"src/components/NotificationDialog.vue:478"},{"id":"app.notificationdialog.deleteNotification","lane":"app","label":"Delete the notification target","detail":"Emits deleteNotification with this.id. On ok the modal closes.","ref":"src/components/NotificationDialog.vue:490"},{"id":"app.notificationdialog.deleteConfirm","lane":"app","label":"Show the delete confirmation","detail":"Hides the settings modal first, then shows Confirm. That order avoids stacked modals.","ref":"src/components/NotificationDialog.vue:417"},{"id":"app.notificationdialog.getUniqueDefaultName","lane":"app","label":"Auto-number the default name","detail":"Counts up in \"Type 1\" form until the name does not clash with an existing one. It only overwrites an empty name or an untouched old default name.","ref":"src/components/NotificationDialog.vue:507"},{"id":"app.socket.notificationList","lane":"app","label":"Receive the notification list","detail":"Replaces $root.notificationList wholesale with the notificationList from the server.","ref":"src/mixins/socket.js:177"},{"id":"app.editmonitor.addedNotification","lane":"app","label":"Auto-enable the notification just added","detail":"Takes the dialog's added event and sets the new ID to true in notificationIDList. It never fires while editing.","ref":"src/pages/EditMonitor.vue:4410"},{"id":"app.editmonitor.default_notification_init","lane":"app","label":"Pre-check the default notification targets","detail":"Only when creating: every notification target with isDefault true is put into notificationIDList automatically.","ref":"src/pages/EditMonitor.vue:4031"},{"id":"app.apprise.checkApprise","lane":"app","label":"Ask whether Apprise is installed","detail":"The Apprise form's mounted emits checkApprise and stores the answer in appriseInstalled.","ref":"src/components/notifications/Apprise.vue:35"},{"id":"api.socket.addNotification","lane":"api","label":"Add / edit a notification target","detail":"Adding and editing share one event. It branches on whether the second argument, notificationID, is present. On failure it returns ok:false and e.message.","ref":"server/server.js:1562"},{"id":"api.socket.deleteNotification","lane":"api","label":"Delete a notification target","detail":"Takes a notificationID and runs Notification.delete. After success it re-broadcasts the notification list.","ref":"server/server.js:1583"},{"id":"api.socket.testNotification","lane":"api","label":"Test send","detail":"Takes the unsaved settings and sends immediately. A failure is written to log.error and answered with ok:false.","ref":"server/server.js:1603"},{"id":"api.socket.checkApprise","lane":"api","label":"Apprise install check","detail":"checkLogin is inside the try, so any exception makes the catch return false unconditionally.","ref":"server/server.js:1623"},{"id":"svc.notification.save","lane":"svc","label":"Save the notification target","detail":"With an ID it fetches the one row matching id and user_id, otherwise \"notification not found\". The whole configuration is stored as JSON in config.","ref":"server/notification.js:265"},{"id":"svc.notification.delete","lane":"svc","label":"Delete the notification target","detail":"Fetches by id and user_id and calls R.trash. Throws \"notification not found\" if there is no match.","ref":"server/notification.js:301"},{"id":"svc.notification.checkApprise","lane":"svc","label":"Is the apprise command there?","detail":"Returns the result of commandExists(\"apprise\") as is. It checks neither the version nor whether it can actually run.","ref":"server/notification.js:315"},{"id":"svc.notification.applyNotificationEveryMonitor","lane":"svc","label":"Apply to every monitor at once","detail":"Walks all of the user's monitors and inserts into monitor_notification only the pairs that are not there yet.","ref":"server/notification.js:326"},{"id":"svc.client.sendNotificationList","lane":"svc","label":"Broadcast the notification list","detail":"Fetches by user_id, turns isDefault/active back into booleans and emits notificationList to every connection of that user.","ref":"server/client.js:18"},{"id":"svc.notification-provider.throwGeneralAxiosError","lane":"svc","label":"Reshape a send error and rethrow it","detail":"Throws an Error whose message is one line concatenating error.code, the HTTP status and the response body.","ref":"server/notification-providers/notification-provider.js:121"},{"id":"svc.notification-provider.renderTemplate","lane":"svc","label":"Render the message template","detail":"Uses Liquid to interpolate msg / monitorJSON / heartbeatJSON. In a test send, monitorJSON is null.","ref":"server/notification-providers/notification-provider.js:75"},{"id":"svc.telegram.send","lane":"svc","label":"Send to Telegram","detail":"POSTs sendMessage. With a template it escapes for MarkdownV2, and in a test it fills in dummy values.","ref":"server/notification-providers/telegram.js:51"},{"id":"svc.webhook.send","lane":"svc","label":"Send to a webhook","detail":"GET puts it in the query; POST sends JSON, form-data or a custom body. If the additional-headers JSON is broken it throws before sending.","ref":"server/notification-providers/webhook.js:11"},{"id":"svc.smtp.send","lane":"svc","label":"Send an email","detail":"Sends through nodemailer. The subject and body are only template-rendered when they are customized. Malformed additional headers throw.","ref":"server/notification-providers/smtp.js:11"},{"id":"svc.apprise.send","lane":"svc","label":"Send through Apprise","detail":"Spawns the apprise command. If stdout contains ERROR it throws; if the output is empty it returns \"No output from apprise\".","ref":"server/notification-providers/apprise.js:10"},{"id":"job.monitor.downCount","lane":"job","label":"Consecutive DOWN counter","detail":"Incremented on a non-important beat while DOWN. At or above resendInterval it resends, then goes back to 0.","ref":"server/model/monitor.js:990"},{"id":"ext.telegram.api","lane":"ext","label":"Telegram Bot API","detail":"/bot\u003ctoken>/sendMessage on https://api.telegram.org by default. A self-hosted server URL can be set instead.","ref":"server/notification-providers/telegram.js:104"},{"id":"ext.webhook.endpoint","lane":"ext","label":"Webhook destination URL","detail":"Any URL the user enters. It goes through the proxy if one is configured. The response body is never validated.","ref":"server/notification-providers/webhook.js:63"},{"id":"ext.smtp.server","lane":"ext","label":"SMTP server","detail":"Connects with host/port/secure and the credentials. With STARTTLS off it sends unencrypted, which logs a warning.","ref":"server/notification-providers/smtp.js:93"},{"id":"ext.apprise.cli","lane":"ext","label":"apprise command","detail":"The apprise installed on the server, launched as an external process. Without it, nothing can be sent.","ref":"server/notification-providers/apprise.js:18"},{"id":"ui.managestatuspage.new_btn","lane":"ui","label":"New page button","detail":"The button on the status page list screen. It only router-navigates to /add-status-page; nothing is sent to the server.","ref":"src/pages/ManageStatusPage.vue:9"},{"id":"ui.addstatuspage.submit_btn","lane":"ui","label":"Next button","detail":"Submits the name and the slug. Both are required. Disabled while processing, which prevents a double submit.","ref":"src/pages/AddStatusPage.vue:56"},{"id":"app.statuspage.submit","lane":"app","label":"Send the creation to the server","detail":"Emits addStatusPage. On success it navigates to /status/\u003cslug>?edit. A UNIQUE constraint is replaced with a dedicated message.","ref":"src/pages/AddStatusPage.vue:87"},{"id":"api.socket.addStatusPage","lane":"api","label":"Add a status page","detail":"Trims title/slug. Empty gives \"Please input all fields\". The slug is lowercased and registered once it passes checkSlug.","ref":"server/socket-handlers/status-page-socket-handler.js:436"},{"id":"svc.status_page_socket_handler.checkSlug","lane":"svc","label":"Slug format check","detail":"A regex allowing letters, digits and hyphens, with no repeated hyphen. A non-string, an empty value or a mismatch throws Invalid Slug.","ref":"server/socket-handlers/status-page-socket-handler.js:533"},{"id":"ui.managestatuspage.delete_btn","lane":"ui","label":"Delete button in the list","detail":"Appears on row hover. click.stop.prevent blocks the link navigation and only opens the confirm dialog.","ref":"src/pages/ManageStatusPage.vue:37"},{"id":"ui.managestatuspage.confirm_delete","lane":"ui","label":"Delete confirm dialog","detail":"A yes/no Confirm. Yes runs deleteStatusPage. No does nothing.","ref":"src/pages/ManageStatusPage.vue:53"},{"id":"app.managestatuspage.deleteStatusPage","lane":"app","label":"Send the delete from the list","detail":"Emits deleteStatusPage. After the success toast it calls window.location.reload() to refetch the list.","ref":"src/pages/ManageStatusPage.vue:96"},{"id":"app.socket.statusPageList","lane":"app","label":"List receive handler","detail":"Takes the list from the statusPageList event and sets statusPageListLoaded to true. A spinner shows until it arrives.","ref":"src/mixins/socket.js:181"},{"id":"svc.status_page.sendStatusPageList","lane":"svc","label":"Send the list to the client","detail":"Fetches every status_page ordered by title, runs toJSON and emits statusPageList. Called exactly once, right after login.","ref":"server/model/status_page.js:366"},{"id":"ui.statuspage.public_view","lane":"ui","label":"Public status page","detail":"What visitors see. It renders nothing until loadedTheme is set. The editing sidebar exists only while enableEditMode is on.","ref":"src/pages/StatusPage.vue:2"},{"id":"ext.visitor_browser.open","lane":"ext","label":"Visitor's browser","detail":"Whoever opens the root of the custom domain. The DNS CNAME is set up beforehand; it is the browser that sends the request","ref":"server/routers/status-page-router.js:16"},{"id":"api.http.status_slug","lane":"api","label":"GET /status/:slug","detail":"Lowercases the slug and renders server-side. apicache 5 minutes. /status and /status-page fall back to slug=default.","ref":"server/routers/status-page-router.js:16"},{"id":"api.http.entry_root","lane":"api","label":"GET / entry routing","detail":"If the host name is in the custom domain table, that page is rendered server-side. If entryPage starts with statusPage-, it goes to /status/…, otherwise /dashboard.","ref":"server/server.js:263"},{"id":"svc.status_page.handleStatusPageResponse","lane":"svc","label":"Return the public page","detail":"A slug of index.html is read as default. No match returns 404 with the bare indexHTML (the Vue side then shows page-not-found).","ref":"server/model/status_page.js:57"},{"id":"svc.status_page.renderHTML","lane":"svc","label":"Assemble the HTML","detail":"Uses cheerio to swap in the title, description, OG tags and favicon, and embeds preloadData into a script tag.","ref":"server/model/status_page.js:160"},{"id":"svc.status_page.getStatusPageData","lane":"svc","label":"Fetch all page data","detail":"Collects the public config, the pinned incidents (pin=1 AND active=1), the public groups and the active maintenance windows in one pass.","ref":"server/model/status_page.js:314"},{"id":"svc.status_page.toPublicJSON","lane":"svc","label":"Narrow to the public settings","detail":"Returns only slug / title / description / theme / CSS and the like. domainNameList is excluded — this is not the same as the admin toJSON.","ref":"server/model/status_page.js:467"},{"id":"svc.group.toPublicJSON","lane":"svc","label":"Group in public form","detail":"Shapes the monitors under the group in weight order. showTags and the certificate expiry flag change which fields come back.","ref":"server/model/group.js:13"},{"id":"svc.status_page.getMaintenanceList","lane":"svc","label":"Fetch the active maintenance","detail":"Of the linked maintenance windows, returns only the ones where isUnderMaintenance is true. An exception is swallowed and an empty array returned.","ref":"server/model/status_page.js:563"},{"id":"app.statuspage.mounted","lane":"app","label":"Screen init","detail":"Decide the slug, getData, arm the auto-refresh timer, then run updateHeartbeatList and loadIncidentHistory. With ?edit it starts in edit mode.","ref":"src/pages/StatusPage.vue:981"},{"id":"app.statuspage.getData","lane":"app","label":"Fetch the settings data","detail":"If window.preloadData exists it resolves immediately with no request. Otherwise it GETs /api/status-page/\u003cslug>. A 404 goes to /page-not-found.","ref":"src/pages/StatusPage.vue:1050"},{"id":"api.http.api_status_page_slug","lane":"api","label":"GET settings API","detail":"The GET that returns the public page JSON. apicache holds it for 5 minutes, so an announcement takes up to five minutes to appear or disappear","ref":"server/routers/status-page-router.js:39"},{"id":"api.http.api_status_page_manifest","lane":"api","label":"GET manifest.json","detail":"For the PWA. Returns only the name and the icons. apicache is 1440 minutes = 24 hours, so a logo change takes a long time to appear.","ref":"server/routers/status-page-router.js:113"},{"id":"api.http.api_status_page_badge","lane":"api","label":"GET status badge SVG","detail":"Works out Up/Degraded/Down/Maintenance from the latest beat of the public monitors and returns an SVG. With no monitors it is N/A (grey).","ref":"server/routers/status-page-router.js:170"},{"id":"ext.analytics.script","lane":"ext","label":"External analytics","detail":"Only google / umami / plausible / matomo / rybbit are allowed. The script is injected into head only when the settings are valid.","ref":"server/analytics/analytics.js:13"},{"id":"app.statuspage.updateHeartbeatList","lane":"app","label":"Auto-refresh the heartbeat data","detail":"Does not run in edit mode (the websocket side is used there). After fetching it updates the down-count badge on the favicon and the countdown to the next refresh.","ref":"src/pages/StatusPage.vue:1075"},{"id":"api.http.api_status_page_heartbeat","lane":"api","label":"GET heartbeat API","detail":"Returns the last 100 beats and the 24-hour uptime for every monitor under the public groups. apicache 1 minute.","ref":"server/routers/status-page-router.js:64"},{"id":"svc.status_page.slugToID","lane":"svc","label":"Slug to ID","detail":"SELECT id FROM status_page WHERE slug=?. On a miss it is undefined and the caller answers \"slug is not found\".","ref":"server/model/status_page.js:494"},{"id":"ui.statuspage.edit_btn","lane":"ui","label":"Edit page button","detail":"Shown only when signed in (hasToken). Pressing it opens the sidebar and switches the rendering from viewing to editing.","ref":"src/pages/StatusPage.vue:278"},{"id":"app.statuspage.edit","lane":"app","label":"Enter edit mode","detail":"Opens an authenticated connection with initSocketIO(true) and sets enableEditMode to true. Without a socket connection, editMode stays false.","ref":"src/pages/StatusPage.vue:1134"},{"id":"api.socket.getStatusPage","lane":"api","label":"Fetch the admin settings","detail":"Login required. Fetches one row by slug and returns toJSON. Nothing found gives \"No slug?\". This is the only path that includes the domain list.","ref":"server/socket-handlers/status-page-socket-handler.js:268"},{"id":"svc.status_page.toJSON","lane":"svc","label":"Shape for the admin view","detail":"On top of the public fields it carries id, published and domainNameList. domainNameList is looked up backwards from the in-memory domain table.","ref":"server/model/status_page.js:438"},{"id":"svc.status_page.getDomainNameList","lane":"svc","label":"Custom domain list","detail":"Walks the static domainMappingList rather than the DB and returns only the entries matching its own slug. It was loaded at startup.","ref":"server/model/status_page.js:422"},{"id":"ui.statuspage.add_group_btn","lane":"ui","label":"Add group button","detail":"Edit mode only. Pressing it just appends to a local array; nothing reaches the DB until you save.","ref":"src/pages/StatusPage.vue:449"},{"id":"app.statuspage.addGroup","lane":"app","label":"Add a group at the top","detail":"The first one is \"Services\", every later one is \"Untitled Group\". It uses unshift, so the newest group lands on top.","ref":"src/pages/StatusPage.vue:1216"},{"id":"ui.statuspage.monitor_select","lane":"ui","label":"Monitor picker","detail":"Only monitors not already published are offered. Choosing one creates a group if there is none and adds it to the first group.","ref":"src/pages/StatusPage.vue:458"},{"id":"ui.statuspage.logo_upload","lane":"ui","label":"Replace the logo image","detail":"Clicking the logo opens the crop dialog. It does not open outside edit mode. The x resets it to /icon.svg.","ref":"src/pages/StatusPage.vue:244"},{"id":"app.statuspage.cropSuccess","lane":"app","label":"Hold the cropped result","detail":"It only puts the data:image/png string into imgDataUrl. Turning it into a real file happens on the server at save time.","ref":"src/pages/StatusPage.vue:1250"},{"id":"ui.statuspage.add_domain_btn","lane":"ui","label":"Add domain button","detail":"The + in the sidebar. It just adds one empty input row. Left empty, it is skipped by the save.","ref":"src/pages/StatusPage.vue:121"},{"id":"ui.statuspage.remove_domain_btn","lane":"ui","label":"Remove domain button","detail":"The x splices that row out of the array. The DB only catches up at save time, through a delete-all-then-recreate.","ref":"src/pages/StatusPage.vue:138"},{"id":"ui.statuspage.save_btn","lane":"ui","label":"Save button","detail":"At the bottom of the sidebar. Disabled while loading. A successful save navigates to the new slug's URL and closes edit mode.","ref":"src/pages/StatusPage.vue:227"},{"id":"ui.statuspage.discard_btn","lane":"ui","label":"Discard button","detail":"Reloads /status/\u003coriginal slug> with no confirmation. Every unsaved change is lost.","ref":"src/pages/StatusPage.vue:232"},{"id":"app.statuspage.save","lane":"app","label":"Send the saved content","detail":"Trims and lowercases the slug and emits saveStatusPage. On success it waits up to 100 ms and then navigates to the new URL.","ref":"src/pages/StatusPage.vue:1149"},{"id":"api.socket.saveStatusPage","lane":"api","label":"Save the status page","detail":"Login required. Saves the settings, the logo, the domains and the public groups in one go. published and password are left untouched.","ref":"server/socket-handlers/status-page-socket-handler.js:292"},{"id":"svc.image_data_uri.outputFile","lane":"svc","label":"Save the logo as PNG","detail":"Only a data: URL of type image/png is allowed; anything else gives \"Only allowed PNG logo.\" It is written to upload as logo\u003cid>.png.","ref":"server/image-data-uri.js:57"},{"id":"svc.status_page.updateDomainNameList","lane":"svc","label":"Update the custom domains","detail":"In a transaction it deletes all of its own rows and re-registers them. If another page has the same domain, it takes it over. A non-array throws.","ref":"server/model/status_page.js:384"},{"id":"svc.status_page.loadDomainMappingList","lane":"svc","label":"Reload the domain table","detail":"Loads the domain-to-slug table from the DB into memory. Called at startup and right after a save; it drives the entry URL routing.","ref":"server/model/status_page.js:352"},{"id":"svc.apicache.clear","lane":"svc","label":"Drop the HTTP cache","detail":"Clears the entire cache right after a save or a delete. Without it, the stale public page is served for five minutes.","ref":"server/modules/apicache/apicache.js:394"},{"id":"ui.statuspage.delete_btn","lane":"ui","label":"Delete in the danger zone","detail":"At the very bottom of the edit sidebar. Pressing it opens a confirm dialog. Nothing is deleted here.","ref":"src/pages/StatusPage.vue:218"},{"id":"ui.statuspage.confirm_delete","lane":"ui","label":"Delete confirm dialog","detail":"Yes runs deleteStatusPage. On success it returns to /manage-status-page.","ref":"src/pages/StatusPage.vue:588"},{"id":"app.statuspage.deleteStatusPage","lane":"app","label":"Send the delete to the server","detail":"Emits deleteStatusPage. On success it leaves edit mode and goes to the list. A failure only shows an error toast and the screen stays.","ref":"src/pages/StatusPage.vue:1192"},{"id":"api.socket.deleteStatusPage","lane":"api","label":"Delete the status page","detail":"Login required. Manually DELETEs incidents, then groups, then the page itself. cname rows go through the foreign key cascade.","ref":"server/socket-handlers/status-page-socket-handler.js:482"},{"id":"ui.statuspage.create_incident_btn","lane":"ui","label":"Create an incident","detail":"Edit mode only. Pressing it opens an empty post form above the content. Any existing draft is set aside.","ref":"src/pages/StatusPage.vue:290"},{"id":"app.statuspage.createIncident","lane":"app","label":"Open the post form","detail":"Creates an empty incident with style defaulting to primary. Anything being edited is parked in previousIncident.","ref":"src/pages/StatusPage.vue:1282"},{"id":"ui.incidenteditform.style_dropdown","lane":"ui","label":"Style picker","detail":"Six choices: info / warning / danger / primary / light / dark. Choosing one changes the box's background class immediately.","ref":"src/components/IncidentEditForm.vue:43"},{"id":"ui.incidenteditform.post_btn","lane":"ui","label":"Post button","detail":"The title and the body are contenteditable. Pressing it emits post to the parent. Markdown works.","ref":"src/components/IncidentEditForm.vue:33"},{"id":"ui.incidenteditform.cancel_btn","lane":"ui","label":"Cancel button","detail":"Closes the form and restores the previous draft if one was parked. Nothing is sent to the server.","ref":"src/components/IncidentEditForm.vue:38"},{"id":"app.statuspage.postIncident","lane":"app","label":"Send the post","detail":"An empty title or body stops it with a toast. On success it closes the form and reloads the history.","ref":"src/pages/StatusPage.vue:1300"},{"id":"app.statuspage.cancelIncident","lane":"app","label":"Cancel editing the post","detail":"Sets enableEditIncidentMode back to false and, if previousIncident exists, restores the original content.","ref":"src/pages/StatusPage.vue:1332"},{"id":"api.socket.postIncident","lane":"api","label":"Post an incident","detail":"Login required. Saved with pin=1 and active=1. With an id it updates and stamps the updated time; without one it creates and stamps the created time.","ref":"server/socket-handlers/status-page-socket-handler.js:34"},{"id":"ui.statuspage.resolve_btn","lane":"ui","label":"Resolve button","detail":"Appears on a pinned card in edit mode. Pressing it goes straight to the server — there is no confirm dialog.","ref":"src/pages/StatusPage.vue:360"},{"id":"app.statuspage.resolveIncident","lane":"app","label":"Send the resolve to the server","detail":"Emits resolveIncident and toasts the result. On success it reloads the history and the card leaves the pinned area.","ref":"src/pages/StatusPage.vue:1484"},{"id":"api.socket.resolveIncident","lane":"api","label":"Resolve an incident","detail":"Login required. Identifies the row by both slug and id. No match answers \"Incident not found or access denied\".","ref":"server/socket-handlers/status-page-socket-handler.js:227"},{"id":"svc.incident.resolve","lane":"svc","label":"Mark it resolved","detail":"Sets active=false and pin=false and stamps the updated time. It is not deleted — it stays in the past incidents list.","ref":"server/model/incident.js:10"},{"id":"api.socket.unpinIncident","lane":"api","label":"Unpin every post at once","detail":"Login required. Sets every pin=1 on that page to 0. active is left alone. Nothing in the current UI reaches it.","ref":"server/socket-handlers/status-page-socket-handler.js:84"},{"id":"app.statuspage.unpinIncident","lane":"app","label":"Unpin method","detail":"A method that emits unpinIncident, but no button in the template calls it — dead code.","ref":"src/pages/StatusPage.vue:1345"},{"id":"ui.statuspage.edit_incident_btn","lane":"ui","label":"Edit button on a pinned post","detail":"Edit on the pinned card. It switches to an inline edit form in place rather than a modal.","ref":"src/pages/StatusPage.vue:364"},{"id":"app.statuspage.editIncident","lane":"app","label":"Start inline editing","detail":"Copies the target into the edit slot. Saving goes through postIncident, so pin and active go back to true.","ref":"src/pages/StatusPage.vue:1322"},{"id":"ui.incidenthistory.edit_btn","lane":"ui","label":"Edit button in the history","detail":"The pencil in the past incidents list. Edit mode only. It opens IncidentManageModal.","ref":"src/components/IncidentHistory.vue:33"},{"id":"ui.incidentmanagemodal.save_btn","lane":"ui","label":"Save in the modal","detail":"Edits the title, body, style and pinned flag. While processing it shows a spinner and cannot be pressed.","ref":"src/components/IncidentManageModal.vue:70"},{"id":"app.incidentmanagemodal.submit","lane":"app","label":"Send the edit","detail":"Empty fields are rejected on the client too. On success it closes the modal, tells the parent with incident-updated and reloads the history.","ref":"src/components/IncidentManageModal.vue:154"},{"id":"api.socket.editIncident","lane":"api","label":"Edit an incident","detail":"Login required. validateIncident rejects empty fields. An invalid style is forced to warning before saving.","ref":"server/socket-handlers/status-page-socket-handler.js:124"},{"id":"svc.status_page_socket_handler.validateIncident","lane":"svc","label":"Validate the post","detail":"Throws when the title or the body is only whitespace. Only editIncident uses it; postIncident never does.","ref":"server/socket-handlers/status-page-socket-handler.js:18"},{"id":"ui.statuspage.delete_incident_btn","lane":"ui","label":"Delete button on a pinned post","detail":"Delete on the pinned card. Pressing it opens the confirm dialog inside the modal. It is not an immediate delete.","ref":"src/pages/StatusPage.vue:368"},{"id":"ui.incidenthistory.delete_btn","lane":"ui","label":"Delete button in the history","detail":"The trash can in the past incidents list. Edit mode only. It leads to the confirm dialog.","ref":"src/components/IncidentHistory.vue:40"},{"id":"ui.incidentmanagemodal.confirm_delete","lane":"ui","label":"Delete confirm dialog","detail":"A yes/no Confirm. Yes sends deleteIncident. No drops the target and does nothing.","ref":"src/components/IncidentManageModal.vue:79"},{"id":"app.incidentmanagemodal.confirmDeleteIncident","lane":"app","label":"Send the delete to the server","detail":"Does nothing when there is no pending target. It toasts the result and, on success, tells the parent and reloads the history.","ref":"src/components/IncidentManageModal.vue:181"},{"id":"api.socket.deleteIncident","lane":"api","label":"Delete an incident","detail":"Login required. Hard-deletes exactly one row matching both slug and id. No match returns not found.","ref":"server/socket-handlers/status-page-socket-handler.js:187"},{"id":"ui.incidenthistory.resolve_btn","lane":"ui","label":"Resolve button in the history","detail":"Shown only while it is unresolved (active). Pressing it runs resolveIncident at once. There is no confirmation.","ref":"src/components/IncidentHistory.vue:25"},{"id":"ui.statuspage.load_more_btn","lane":"ui","label":"Load more button","detail":"Shown only while hasMore is true. Disabled with a spinner while loading. Each press adds ten more.","ref":"src/pages/StatusPage.vue:526"},{"id":"app.statuspage.loadMoreIncidentHistory","lane":"app","label":"Load the next page","detail":"Runs only while hasMore and nextCursor are both set. Fetches with the cursor and appends to the existing list.","ref":"src/pages/StatusPage.vue:1456"},{"id":"app.statuspage.loadIncidentHistoryWithCursor","lane":"app","label":"Fetch the history","detail":"In edit mode it goes over the socket; for a visitor it goes over HTTP. The HTTP path shows no toast when it fails.","ref":"src/pages/StatusPage.vue:1408"},{"id":"api.socket.getIncidentHistory","lane":"api","label":"Fetch the history (socket)","detail":"No login required. It decides isPublic from whether userID is set and passes it on, but the receiving side never uses the value.","ref":"server/socket-handlers/status-page-socket-handler.js:103"},{"id":"api.http.api_status_page_incident_history","lane":"api","label":"GET history API","detail":"Fetches the next page with the cursor query. apicache 5 minutes. A missing page returns Status Page Not Found.","ref":"server/routers/status-page-router.js:145"},{"id":"svc.status_page.getIncidentHistory","lane":"svc","label":"Fetch the history by page","detail":"Ten at a time, created_date descending. The cursor is the last created time. Resolved and unresolved are returned alike.","ref":"server/model/status_page.js:517"},{"id":"svc.incident.toPublicJSON","lane":"svc","label":"Shape the post for the public","detail":"Returns id, style, title, body, pin, active and the created/updated times. The body is rendered as Markdown and sanitized on the client.","ref":"server/model/incident.js:21"},{"id":"ext.rss_reader.subscribe","lane":"ext","label":"RSS reader","detail":"An outside subscriber that polls /status/\u003cslug>/rss. No authentication — anyone can subscribe.","ref":"server/routers/status-page-router.js:22"},{"id":"api.http.status_slug_rss","lane":"api","label":"GET RSS feed","detail":"apicache 5 minutes. A missing page returns 404 with the bare indexHTML (note: not RSS).","ref":"server/routers/status-page-router.js:22"},{"id":"svc.status_page.handleStatusPageRSSResponse","lane":"svc","label":"Build the RSS response","detail":"Looks the page up by slug, builds the feed URL and returns it as application/rss+xml.","ref":"server/model/status_page.js:38"},{"id":"svc.status_page.buildRSSUrl","lane":"svc","label":"Decide the feed URL","detail":"x-forwarded-proto/host are honoured only while trustProxy is on. With no request it is built from the config.","ref":"server/model/status_page.js:128"},{"id":"svc.status_page.renderRSS","lane":"svc","label":"Assemble the RSS XML","detail":"The title is rss_title first, then the page title. Pinned incidents and monitors that are down become the items.","ref":"server/model/status_page.js:79"},{"id":"svc.status_page.getRSSPageData","lane":"svc","label":"Collect the RSS data","detail":"Pulls the latest beat for each monitor and works out the overall status. Only the DOWN ones stay in the feed.","ref":"server/model/status_page.js:277"},{"id":"svc.status_page.overallStatus","lane":"svc","label":"Work out the overall status","detail":"Any maintenance means maintenance. No UP at all means everything is down; a mix means partially degraded. Zero monitors gives -1.","ref":"server/model/status_page.js:218"},{"id":"ext.dns.cname","lane":"ext","label":"DNS for the custom domain","detail":"The user has to point a CNAME at Uptime Kuma. The app only matches on the Host name.","ref":"server/server.js:275"},{"id":"db.status_page","lane":"db","label":"status_page","detail":"slug is UNIQUE. The published / search_engine_index / password columns exist, but the save never writes them, so they keep their defaults.","ref":"db/knex_init_db.js:185"},{"id":"db.status_page_cname","lane":"db","label":"Custom domain","detail":"Maps custom domains to pages. domain is UNIQUE. Rows go away in the cascade when the status_page is deleted.","ref":"db/knex_init_db.js:391"},{"id":"db.incident","lane":"db","label":"incident","detail":"pin and active default to true. status_page_id has no foreign key, so deleting a page needs a manual DELETE.","ref":"db/knex_init_db.js:151"},{"id":"db.group","lane":"db","label":"group","detail":"The public groups. Narrowed by public=1 and status_page_id. Anything not in the submitted list is deleted during a save.","ref":"db/knex_init_db.js:26"},{"id":"db.monitor_group","lane":"db","label":"monitor_group","detail":"Maps groups to monitors. Every save deletes and recreates it per group, and weight is renumbered.","ref":"db/knex_init_db.js:248"},{"id":"db.maintenance","lane":"db","label":"maintenance","detail":"The maintenance itself: title, description, creator, active flag, strategy, start and end dates, times, weekdays, cron and duration","ref":"db/knex_init_db.js:164"},{"id":"db.maintenance_status_page","lane":"db","label":"maintenance_status_page","detail":"Maps maintenance windows to status pages. Only windows linked here show up on the public page.","ref":"db/knex_init_db.js:205"},{"id":"ui.managemaintenance.list","lane":"ui","label":"Maintenance list","detail":"Renders $root.maintenanceList ordered by status (under maintenance > scheduled > inactive > ended). No rows means No Maintenance. The status is the row colour","ref":"src/pages/ManageMaintenance.vue:23"},{"id":"ui.managemaintenance.schedule_btn","lane":"ui","label":"Schedule maintenance button","detail":"A link to /add-maintenance. It opens the create screen","ref":"src/pages/ManageMaintenance.vue:9"},{"id":"ui.managemaintenance.pause_btn","lane":"ui","label":"Pause button","detail":"Only on rows where item.active is true. Pressing it opens the confirm dialog and stashes the ID in selectedMaintenanceID","ref":"src/pages/ManageMaintenance.vue:38"},{"id":"ui.managemaintenance.resume_btn","lane":"ui","label":"Resume button","detail":"Only on rows where item.active is false. It sends resumeMaintenance immediately, with no confirm dialog","ref":"src/pages/ManageMaintenance.vue:48"},{"id":"ui.managemaintenance.clone_btn","lane":"ui","label":"Clone button","detail":"Navigates to /maintenance/clone/:id. After loading it clears the id and adds cloneOf to the title, so saving creates a new one","ref":"src/pages/ManageMaintenance.vue:58"},{"id":"ui.managemaintenance.edit_btn","lane":"ui","label":"Edit button","detail":"Navigates to /maintenance/edit/:id and opens the edit screen","ref":"src/pages/ManageMaintenance.vue:67"},{"id":"ui.managemaintenance.delete_btn","lane":"ui","label":"Delete button","detail":"Opens the confirm dialog and stashes the ID in selectedMaintenanceID","ref":"src/pages/ManageMaintenance.vue:76"},{"id":"ui.managemaintenance.confirm_pause","lane":"ui","label":"Pause confirm dialog","detail":"\"Yes\" runs pauseMaintenance. No sends nothing","ref":"src/pages/ManageMaintenance.vue:95"},{"id":"ui.managemaintenance.confirm_delete","lane":"ui","label":"Delete confirm dialog","detail":"\"Yes\" runs deleteMaintenance. It cannot be undone","ref":"src/pages/ManageMaintenance.vue:99"},{"id":"ui.editmaintenance.strategy_select","lane":"ui","label":"Strategy picker","detail":"Six choices: manual, single window, cron expression, or recurring (interval, weekday, day of month). The choice swaps the fields below it and which of them are required","ref":"src/pages/EditMaintenance.vue:110"},{"id":"ui.editmaintenance.affected_monitors","lane":"ui","label":"Affected monitors (multi-select)","detail":"A pseudo-entry, \"Select All\", sits at the top. Paused monitors are listed last","ref":"src/pages/EditMaintenance.vue:42"},{"id":"ui.editmaintenance.show_all_pages","lane":"ui","label":"Show on all status pages","detail":"Ticking it hides the individual picker and sends every candidate page at save time. Pages added later are not picked up automatically","ref":"src/pages/EditMaintenance.vue:75"},{"id":"ui.editmaintenance.status_pages","lane":"ui","label":"Status pages (multi-select)","detail":"Chooses which status pages announce it. It can be saved with none selected as long as there is at least one monitor","ref":"src/pages/EditMaintenance.vue:87"},{"id":"ui.editmaintenance.quick_duration_btn","lane":"ui","label":"Quick duration buttons","detail":"Only for a single window. It fills the end time from the start time plus the given minutes. With no start time it just shows an error toast","ref":"src/pages/EditMaintenance.vue:335"},{"id":"ui.editmaintenance.save_btn","lane":"ui","label":"Save button","detail":"Disabled while processing. submit only runs after the form's required checks pass","ref":"src/pages/EditMaintenance.vue:431"},{"id":"ui.editmaintenance.confirm_no_monitors","lane":"ui","label":"No-monitors confirmation","detail":"Appears only when there are zero monitors but at least one status page. Yes continues the save","ref":"src/pages/EditMaintenance.vue:438"},{"id":"ui.editmaintenance.toast","lane":"ui","label":"Error toast","detail":"Shows, verbatim, the messages for empty monitors and pages, a failed request, or a server-side exception","ref":"src/pages/EditMaintenance.vue:825"},{"id":"ui.maintenancetime.timeslot","lane":"ui","label":"Window display","detail":"\"Manual\" for manual; otherwise the head of timeslotList (the current or next window) shown as a time range with its UTC offset","ref":"src/components/MaintenanceTime.vue:6"},{"id":"app.editmaintenance.init","lane":"app","label":"Edit screen init","detail":"For a new one it builds the defaults (single window, one hour from now). For an edit or a clone it calls getMaintenance and then fetches the two kinds of targets","ref":"src/pages/EditMaintenance.vue:677"},{"id":"app.editmaintenance.onMonitorSelect","lane":"app","label":"Toggle select-all","detail":"Runs only when \"Select All\" is chosen. If everything is already selected it empties the list, otherwise it puts every candidate back in","ref":"src/pages/EditMaintenance.vue:762"},{"id":"app.editmaintenance.setQuickDuration","lane":"app","label":"Work out and fill the end time","detail":"With no start time it shows a toast and stops. Otherwise it writes start + minutes into the end field as a local-time string","ref":"src/pages/EditMaintenance.vue:786"},{"id":"app.editmaintenance.submit","lane":"app","label":"Save entry point","detail":"With zero monitors but at least one status page it opens the confirm dialog and waits. Otherwise it goes straight to doSubmit","ref":"src/pages/EditMaintenance.vue:808"},{"id":"app.editmaintenance.doSubmit","lane":"app","label":"The save itself","detail":"Both empty aborts with an error. New and clone send addMaintenance, an edit sends editMaintenance, and after success the two kinds of targets are registered in turn","ref":"src/pages/EditMaintenance.vue:821"},{"id":"app.editmaintenance.addMonitorMaintenance","lane":"app","label":"Send the affected monitors","detail":"Sends the selected monitor array as is. A failure only toasts and it moves on to the next step","ref":"src/pages/EditMaintenance.vue:871"},{"id":"app.editmaintenance.addMaintenanceStatusPage","lane":"app","label":"Send the target pages","detail":"With \"all pages\" it sends every candidate, otherwise the selection. A failure only toasts and the navigation still happens","ref":"src/pages/EditMaintenance.vue:889"},{"id":"app.managemaintenance.sortedMaintenanceList","lane":"app","label":"Sort the list","detail":"Descending by status weight (under maintenance 1000 down to unknown 0), then by title. It is recomputed every time maintenanceList arrives","ref":"src/pages/ManageMaintenance.vue:135"},{"id":"app.managemaintenance.pauseMaintenance","lane":"app","label":"Send the pause","detail":"Emits pauseMaintenance with the stashed selectedMaintenanceID and toasts the result","ref":"src/pages/ManageMaintenance.vue:203"},{"id":"app.managemaintenance.resumeMaintenance","lane":"app","label":"Send the resume","detail":"Takes the row's ID as an argument and emits resumeMaintenance. No confirmation in between","ref":"src/pages/ManageMaintenance.vue:214"},{"id":"app.managemaintenance.deleteMaintenance","lane":"app","label":"Send the delete","detail":"Emits deleteMaintenance with selectedMaintenanceID. On success it stays on /maintenance","ref":"src/pages/ManageMaintenance.vue:179"},{"id":"app.socket.addMaintenance","lane":"app","label":"Emit addMaintenance","detail":"A thin wrapper that sends the maintenance form content over socket.io","ref":"src/mixins/socket.js:575"},{"id":"app.socket.addMonitorMaintenance","lane":"app","label":"Emit the affected monitors","detail":"A thin wrapper that sends the maintenance ID and the monitor array on addMonitorMaintenance","ref":"src/mixins/socket.js:586"},{"id":"app.socket.addMaintenanceStatusPage","lane":"app","label":"Emit the announcement pages","detail":"A thin wrapper that sends the maintenance ID and the page array on addMaintenanceStatusPage","ref":"src/mixins/socket.js:597"},{"id":"app.socket.getMaintenanceList","lane":"app","label":"Emit getMaintenanceList","detail":"Asks for the list again. With no callback it passes an empty function","ref":"src/mixins/socket.js:540"},{"id":"app.socket.deleteMaintenance","lane":"app","label":"Emit deleteMaintenance","detail":"A thin wrapper that sends the maintenance ID","ref":"src/mixins/socket.js:638"},{"id":"app.socket.maintenanceList","lane":"app","label":"Receive the list","detail":"Replaces maintenanceList from the server wholesale. It updates on its own from actions on other screens, without anyone pressing anything here","ref":"src/mixins/socket.js:169"},{"id":"api.socket.addMaintenance","lane":"api","label":"addMaintenance received","detail":"Check login, turn the form into a bean, save it, put it in the in-memory list and call run(true). A failure comes back as ok:false with a message","ref":"server/socket-handlers/maintenance-socket-handler.js:16"},{"id":"api.socket.editMaintenance","lane":"api","label":"editMaintenance received","detail":"Takes the bean from memory and answers Permission denied to anyone but its creator. Overwrites it and re-arms with run(true)","ref":"server/socket-handlers/maintenance-socket-handler.js:46"},{"id":"api.socket.addMonitorMaintenance","lane":"api","label":"addMonitorMaintenance received","detail":"Deletes every monitor link and puts back what it was sent. There is no owner check, only a login check","ref":"server/socket-handlers/maintenance-socket-handler.js:77"},{"id":"api.socket.addMaintenanceStatusPage","lane":"api","label":"addMaintenanceStatusPage received","detail":"Deletes every status page link, puts back what it was sent, and drops the public page cache","ref":"server/socket-handlers/maintenance-socket-handler.js:109"},{"id":"api.socket.getMaintenance","lane":"api","label":"getMaintenance received","detail":"Reads the one row where id and user_id match. Someone else's ID leaves bean null, toJSON throws, and it answers ok:false","ref":"server/socket-handlers/maintenance-socket-handler.js:140"},{"id":"api.socket.getMaintenanceList","lane":"api","label":"getMaintenanceList received","detail":"Re-broadcasts the list to that user. The return value is just ok; the content arrives on the maintenanceList event","ref":"server/socket-handlers/maintenance-socket-handler.js:160"},{"id":"api.socket.getMonitorMaintenance","lane":"api","label":"getMonitorMaintenance received","detail":"Joins the link table with the monitor table and returns only the target monitor IDs. It is not narrowed by owner","ref":"server/socket-handlers/maintenance-socket-handler.js:176"},{"id":"api.socket.getMaintenanceStatusPage","lane":"api","label":"getMaintenanceStatusPage received","detail":"Joins the link table with the status page table and returns the ids and titles","ref":"server/socket-handlers/maintenance-socket-handler.js:200"},{"id":"api.socket.deleteMaintenance","lane":"api","label":"deleteMaintenance received","detail":"If it is in memory it is stopped and removed first, then the row matching id and user_id is deleted. The cache is dropped too","ref":"server/socket-handlers/maintenance-socket-handler.js:224"},{"id":"api.socket.pauseMaintenance","lane":"api","label":"pauseMaintenance received","detail":"Not in memory gives Maintenance not found. Sets active false, saves, and stops the cron","ref":"server/socket-handlers/maintenance-socket-handler.js:254"},{"id":"api.socket.resumeMaintenance","lane":"api","label":"resumeMaintenance received","detail":"Sets active true, saves and calls run(). A failure inside run is swallowed and only the success toast comes back","ref":"server/socket-handlers/maintenance-socket-handler.js:287"},{"id":"svc.maintenance.jsonToBean","lane":"svc","label":"Pack the form into a bean","detail":"Dates are checked for validity and for a year at or below 9999. The cron strategy validates the duration and the expression; the recurring strategies build a cron from the time, weekday or day of month and validate that","ref":"server/model/maintenance.js:146"},{"id":"svc.maintenance.validateCron","lane":"svc","label":"Validate the cron expression","detail":"A check that builds a Cron and immediately stops it. An invalid one throws and aborts before saving","ref":"server/model/maintenance.js:202"},{"id":"svc.maintenance.generateCron","lane":"svc","label":"Build the cron expression","detail":"For a recurring strategy it builds the cron string from the start time and the weekday or day of month, and works out the duration. For month end, only lastDay1 maps to L","ref":"server/model/maintenance.js:455"},{"id":"svc.maintenance.calcDuration","lane":"svc","label":"Work out the duration","detail":"Takes the difference between the start and end times in seconds. A window crossing midnight gets 24 hours added to keep it positive","ref":"server/model/maintenance.js:131"},{"id":"svc.maintenance.run","lane":"svc","label":"Arm the schedule","detail":"Stops any existing job and rebuilds it. Old data with no cron gets one generated and saved here. The manual strategy does nothing","ref":"server/model/maintenance.js:212"},{"id":"svc.maintenance.stop","lane":"svc","label":"Stop the schedule","detail":"Stops the cron job and drops the reference. It does not cancel a running window's end timer, so the state survives until the next broadcast","ref":"server/model/maintenance.js:383"},{"id":"svc.maintenance.getRunningTimeslot","lane":"svc","label":"Work out the running window","detail":"Builds a window from the next run time minus the duration and, if now is inside it, returns the start and end. Outside it, null","ref":"server/model/maintenance.js:346"},{"id":"svc.maintenance.inferDuration","lane":"svc","label":"Decide this run's length","detail":"Uses the remaining time if one was given, otherwise the duration. Near the end date it is trimmed to the end date","ref":"server/model/maintenance.js:366"},{"id":"svc.maintenance.getStatus","lane":"svc","label":"Work out the current status","detail":"Inactive when paused, always under maintenance for the manual strategy, scheduled before the start, ended past the end date. Anything else comes from the in-memory state","ref":"server/model/maintenance.js:421"},{"id":"svc.maintenance.getTimezone","lane":"svc","label":"Resolve the timezone","detail":"Unset, or set to the same as the server, returns the server timezone. The cron fires according to it","ref":"server/model/maintenance.js:402"},{"id":"svc.maintenance.toPublicJSON","lane":"svc","label":"Convert to screen JSON","detail":"Packs in the status, the timezone and the current and next windows. The windows are computed from the cron job every time, not read from the DB","ref":"server/model/maintenance.js:15"},{"id":"svc.server.sendMaintenanceList","lane":"svc","label":"Broadcast the list","detail":"An entry point that only pulls the user ID off the acting socket and hands it to the broadcast","ref":"server/uptime-kuma-server.js:287"},{"id":"svc.server.sendMaintenanceListByUserID","lane":"svc","label":"Broadcast the list to a user","detail":"Sends maintenanceList to that user's room. Every tab of the same user updates at once","ref":"server/uptime-kuma-server.js:296"},{"id":"svc.server.getMaintenanceJSONList","lane":"svc","label":"Turn the list into JSON","detail":"Converts every maintenance in memory. It is not narrowed by the user ID argument, so other users' entries are mixed in","ref":"server/uptime-kuma-server.js:307"},{"id":"svc.server.loadMaintenanceList","lane":"svc","label":"Load everything at startup","detail":"Puts every maintenance from the DB into memory and calls run. It is not awaited, so the state can be undecided right after startup","ref":"server/uptime-kuma-server.js:320"},{"id":"svc.server.getMaintenance","lane":"svc","label":"Get one from memory","detail":"Reads from the in-memory list. Something present in the DB but not in memory comes back null","ref":"server/uptime-kuma-server.js:334"},{"id":"job.maintenance.singleJob","lane":"job","label":"Single-window start job","detail":"Fires once at the start time, re-broadcasts the list and drops the public page cache. The end is left to the end-time check","ref":"server/model/maintenance.js:234"},{"id":"job.maintenance.startEvent","lane":"job","label":"Maintenance start","detail":"Sets the status to running, clears the previous end timer, arms a new one and writes the last start time to the DB","ref":"server/model/maintenance.js:246"},{"id":"job.maintenance.durationTimeout","lane":"job","label":"End timer","detail":"After the duration it puts the status back to scheduled and broadcasts the list. It is an in-process timer, so a restart loses it","ref":"server/model/maintenance.js:256"},{"id":"job.maintenance.intervalJob","lane":"job","label":"Interval recurrence job","detail":"Fires at the start time every day and only starts when enough days have passed since the last start. It counts from the start date","ref":"server/model/maintenance.js:280"},{"id":"job.maintenance.intervalSkip","lane":"job","label":"Skipped for being too soon","detail":"On a day that has not reached the interval it does nothing. It allows 1.1 hours of slack to absorb clock drift","ref":"server/model/maintenance.js:296"},{"id":"job.maintenance.cronJob","lane":"job","label":"cron / weekday / day-of-month job","detail":"Fires on the generated or entered cron expression. The timezone follows each maintenance's own setting","ref":"server/model/maintenance.js:311"},{"id":"ui.settingsGeneral.saveGeneral","lane":"ui","label":"Save the general settings","detail":"The Save button on Settings > General runs saveGeneral(), which stores the timezone in localStorage and then calls saveSettings()","ref":"src/components/settings/General.vue:260"},{"id":"ui.settings.saveSettings","lane":"ui","label":"Save the settings","detail":"Once validateSettings() passes it emits setSettings with currentPassword and, on success, runs loadSettings() again","ref":"src/pages/Settings.vue:208"},{"id":"ui.settings.loadSettings","lane":"ui","label":"Load the settings","detail":"Emits getSettings, applies the data from the response to this.settings and fills in the defaults","ref":"src/pages/Settings.vue:155"},{"id":"ui.proxyDialog.submit","lane":"ui","label":"Save the proxy","detail":"The ProxyDialog form submit emits addProxy with the proxy data and the id","ref":"src/components/ProxyDialog.vue:266"},{"id":"ui.dockerHostDialog.submit","lane":"ui","label":"Save the Docker host","detail":"The Save button in DockerHostDialog emits addDockerHost with the dockerHost data and the id","ref":"src/components/DockerHostDialog.vue:163"},{"id":"ui.dockerHostDialog.test","lane":"ui","label":"Test the Docker host connection","detail":"The Test button in DockerHostDialog emits testDockerHost and shows the answer in a toast","ref":"src/components/DockerHostDialog.vue:184"},{"id":"ui.remoteBrowserDialog.submit","lane":"ui","label":"Save the remote browser","detail":"The RemoteBrowserDialog form submit emits addRemoteBrowser with the remoteBrowser data and the id","ref":"src/components/RemoteBrowserDialog.vue:147"},{"id":"ui.monitorHistory.loadDatabaseSize","lane":"ui","label":"Get the DB size","detail":"On mount, or after a successful shrink, it emits getDatabaseSize and updates databaseSize","ref":"src/components/settings/MonitorHistory.vue:95"},{"id":"ui.monitorHistory.shrinkDatabase","lane":"ui","label":"Shrink the DB","detail":"The Shrink Database button emits shrinkDatabase and, on success, runs loadDatabaseSize() again","ref":"src/components/settings/MonitorHistory.vue:111"},{"id":"ui.monitorHistory.clearStatistics","lane":"ui","label":"Clear all statistics","detail":"The Clear all statistics button, then the Confirm dialog, calls $root.clearStatistics() and reloads the whole screen on success","ref":"src/components/settings/MonitorHistory.vue:134"},{"id":"ui.monitorDetail.clearEvents","lane":"ui","label":"Clear the event history","detail":"Clear Data > Events on the monitor details screen, then the Confirm dialog, calls $root.clearEvents(monitorID)","ref":"src/pages/Details.vue:730"},{"id":"ui.monitorDetail.clearHeartbeats","lane":"ui","label":"Clear the heartbeats","detail":"Clear Data > Heartbeats on the monitor details screen, then the Confirm dialog, calls $root.clearHeartbeats(monitorID)","ref":"src/pages/Details.vue:744"},{"id":"app.socket.clearEvents","lane":"app","label":"Emit clear events","detail":"A wrapper that emits clearEvents with the monitorID and a callback","ref":"src/mixins/socket.js:689"},{"id":"app.socket.clearHeartbeats","lane":"app","label":"Emit clear heartbeats","detail":"A wrapper that emits clearHeartbeats with the monitorID and a callback","ref":"src/mixins/socket.js:699"},{"id":"app.socket.clearStatistics","lane":"app","label":"Emit clear all statistics","detail":"A wrapper that emits clearStatistics with a callback","ref":"src/mixins/socket.js:708"},{"id":"api.socket.getSettings","lane":"api","label":"Get the settings","detail":"getSettings received. After checkLogin it calls getSettings(\"general\"), fills in serverTimezone and returns","ref":"server/server.js:1478"},{"id":"api.socket.setSettings","lane":"api","label":"Save the settings","detail":"setSettings received. It validates a disableAuth change, saves the settings, then applies the timezone, Chrome and nscd changes","ref":"server/server.js:1499"},{"id":"api.socket.clearEvents","lane":"api","label":"Clear events","detail":"clearEvents received. After checkLogin it UPDATEs heartbeat.msg/important directly for the given monitor_id","ref":"server/server.js:1658"},{"id":"api.socket.clearHeartbeats","lane":"api","label":"Clear heartbeats","detail":"clearHeartbeats received. After checkLogin it calls UptimeCalculator.clearStatistics(monitorID) and restarts the monitor if it is active","ref":"server/server.js:1677"},{"id":"api.socket.clearStatistics","lane":"api","label":"Clear statistics (everything)","detail":"clearStatistics received. After checkLogin it calls UptimeCalculator.clearAllStatistics() and restarts every active monitor","ref":"server/server.js:1705"},{"id":"api.socket.addProxy","lane":"api","label":"Add a proxy","detail":"addProxy received. After checkLogin it calls Proxy.save, re-sends the list, and also calls reloadProxy when applyExisting is set","ref":"server/socket-handlers/proxy-socket-handler.js:13"},{"id":"api.socket.addDockerHost","lane":"api","label":"Add a Docker host","detail":"addDockerHost received. After checkLogin it calls DockerHost.save and re-sends the list","ref":"server/socket-handlers/docker-socket-handler.js:12"},{"id":"api.socket.testDockerHost","lane":"api","label":"Test a Docker host","detail":"testDockerHost received. After checkLogin it calls DockerHost.testDockerHost and returns the container count (no DB change)","ref":"server/socket-handlers/docker-socket-handler.js:53"},{"id":"api.socket.addRemoteBrowser","lane":"api","label":"Add a remote browser","detail":"addRemoteBrowser received. After checkLogin it calls RemoteBrowser.save and re-sends the list","ref":"server/socket-handlers/remote-browser-socket-handler.js:14"},{"id":"api.socket.getDatabaseSize","lane":"api","label":"Get the DB size","detail":"getDatabaseSize received. After checkLogin it returns the result of Database.getSize()","ref":"server/socket-handlers/database-socket-handler.js:11"},{"id":"api.socket.shrinkDatabase","lane":"api","label":"Shrink the DB","detail":"shrinkDatabase received. After checkLogin it calls Database.shrink()","ref":"server/socket-handlers/database-socket-handler.js:26"},{"id":"svc.settingsUtil.getSettings","lane":"svc","label":"Get the settings (delegating)","detail":"A helper in util-server.js. A thin wrapper that delegates straight to Settings.getSettings(type)","ref":"server/util-server.js:411"},{"id":"svc.settingsUtil.setSettings","lane":"svc","label":"Save the settings (delegating)","detail":"A helper in util-server.js. A thin wrapper that delegates straight to Settings.setSettings(type, data)","ref":"server/util-server.js:421"},{"id":"svc.settings.getSettings","lane":"svc","label":"Get the settings (implementation)","detail":"SELECTs every key/value of the given type from the setting table, JSON.parses them and returns an object","ref":"server/settings.js:89"},{"id":"svc.settings.setSettings","lane":"svc","label":"Save the settings in bulk (implementation)","detail":"For each key in data it findOne/dispenses the bean of the matching type, JSON-stringifies the value, R.stores it and drops the cache","ref":"server/settings.js:111"},{"id":"svc.proxy.save","lane":"svc","label":"Save the proxy","detail":"Validate the protocol, clear the existing default when default is set, put the values on the bean and R.store it; with applyExisting it is applied to every monitor","ref":"server/proxy.js:20"},{"id":"svc.proxy.applyProxyEveryMonitor","lane":"svc","label":"Apply to every monitor","detail":"A private function called from inside save(). It UPDATEs proxy_id on every monitor of that user to the new ID","ref":"server/proxy.js:185"},{"id":"svc.proxy.reloadProxy","lane":"svc","label":"Reload the monitor list","detail":"Called from the socket handler after a save. It refetches monitor.id and proxy_id and applies them to the in-memory monitorList (no DB write)","ref":"server/proxy.js:164"},{"id":"svc.docker.save","lane":"svc","label":"Save the Docker host","detail":"Finds the existing bean by id + user_id or dispenses a new one, sets name/dockerDaemon/dockerType and R.stores it","ref":"server/docker.js:21"},{"id":"svc.docker.testDockerHost","lane":"svc","label":"Test the Docker connection","detail":"Requests /containers/json?all=true from the Docker daemon over a socket or TCP and returns the container count. It changes nothing in the DB","ref":"server/docker.js:68"},{"id":"svc.remoteBrowser.save","lane":"svc","label":"Save the remote browser","detail":"Finds the existing bean by id + user_id or dispenses a new one, sets name/url and R.stores it","ref":"server/remote-browser.js:27"},{"id":"svc.database.getSize","lane":"svc","label":"Get the DB size","detail":"Only under SQLite: returns the size of the kuma.db file via fs.stat. Otherwise it returns 0","ref":"server/database.js:812"},{"id":"svc.database.shrink","lane":"svc","label":"Shrink the DB (VACUUM)","detail":"Only under SQLite: runs R.exec(\"VACUUM\") to compact the file. Otherwise it does nothing","ref":"server/database.js:826"},{"id":"svc.uptimeCalculator.clearStatistics","lane":"svc","label":"Clear one monitor's statistics","detail":"DELETEs all heartbeat / stat_minutely / stat_hourly / er","label":"Send to the external notification service","branch":"normal","kind":"call","evidence":"direct"},{"from":"job.monitor.beat","to":"db.heartbeat","label":"Save with important=true and downCount=0","branch":"recovered","kind":"query","evidence":"direct"},{"from":"job.monitor.beat","to":"svc.uptime.update","label":"Add to the up totals along with the ping","branch":"normal","kind":"call","evidence":"direct"},{"from":"job.monitor.beat","to":"job.monitor.safeBeat","label":"Schedule the next run (normal interval)","branch":"normal","kind":"framework","evidence":"framework"}],"notes":["When bean.status===UP the message text is the fixed 'Up' wording (monitor.js:1457-1458)","Even if fetching lastDownTime fails, the notification still goes out (monitor.js:1495-1502, swallowed by try/catch)","PENDING to UP counts as important for neither isImportantBeat nor isImportantForNotification (no notification). Only DOWN to UP is important (monitor.js:1392,1427)"]},{"id":"monitor-maintenance-suppress","title":"Suppressed while under maintenance","category":"Running the checks","trigger":"isUnderMaintenance returns true at the top of every job.monitor.beat run","steps":[{"from":"job.monitor.beat","to":"svc.monitor.isUnderMaintenance","label":"Check whether it is under maintenance","branch":"normal","kind":"call","evidence":"direct"},{"from":"svc.monitor.isUnderMaintenance","to":"db.monitor_maintenance","label":"Fetch the linked maintenance_ids","branch":"normal","kind":"query","evidence":"direct"},{"from":"svc.monitor.isUnderMaintenance","to":"svc.maintenance.isUnderMaintenance","label":"Check the status of each maintenance","branch":"normal","kind":"call","evidence":"direct"},{"from":"svc.maintenance.isUnderMaintenance","to":"svc.monitor.isUnderMaintenance","label":"true (a maintenance window is active)","branch":"maintenance","kind":"return","evidence":"direct"},{"from":"svc.monitor.isUnderMaintenance","to":"job.monitor.beat","label":"true: under maintenance","branch":"mai
